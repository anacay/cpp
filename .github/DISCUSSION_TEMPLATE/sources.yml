title: "[Source] "
labels: ["source"]
body:
  - type: input
    id: citation
    attributes:
      label: Citation and link
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it worth reading, and for whom?
      description: New planner, experienced planner, finance, supply? One or two lines.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Before you post
      options:
        - label: It's publicly available.
          required: true
  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: "I license what I post here under CC BY-SA 4.0 (code under MIT), and it's mine to share. See [CONTRIBUTING.md](https://github.com/anacay/cpp/blob/main/CONTRIBUTING.md#licence)."
          required: true
