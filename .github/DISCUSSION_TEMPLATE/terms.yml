title: "[Term] "
labels: ["term"]
body:
  - type: input
    id: term
    attributes:
      label: Term
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Proposed definition, in one plain sentence
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: How people use it in practice
      description: Different meanings in different places? Synonyms? Terms it gets confused with? That's exactly what we want to hear.
  - type: input
    id: source
    attributes:
      label: Public source that uses it this way, if any
  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: "I license what I post here under CC BY-SA 4.0 (code under MIT), and it's mine to share. See [CONTRIBUTING.md](https://github.com/anacay/cpp/blob/main/CONTRIBUTING.md#licence)."
          required: true
