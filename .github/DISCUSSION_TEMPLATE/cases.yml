title: "[Case] "
labels: ["case"]
body:
  - type: markdown
    attributes:
      value: |
        Share a "what happened" story, anonymized. Remove company, product, team, system and people names. Use illustrative numbers that keep the shape. Mark opinion as opinion.
        This thread is public. An editor will check it again before anything goes into the case library.
        Read [Sharing safely](https://cpp.anacay.org/sharing-safely/) first. Not sure? Write to cpp@anacay.org with "Pre-check" in the subject for a private reply within 72 hours.
  - type: input
    id: setting
    attributes:
      label: Setting, in general terms
      placeholder: "A large fleet, planning a new accelerator cluster"
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: What happened, and why do you think it did?
    validations:
      required: true
  - type: textarea
    id: lesson
    attributes:
      label: What would you tell a new planner?
  - type: checkboxes
    id: safe
    attributes:
      label: Before you post
      options:
        - label: No identifying names, unless already public and cited.
          required: true
        - label: Numbers are illustrative, not real internal figures.
          required: true
  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: "I license what I post here under CC BY-SA 4.0 (code under MIT), and it's mine to share. See [CONTRIBUTING.md](https://github.com/anacay/cpp/blob/main/CONTRIBUTING.md#licence)."
          required: true
