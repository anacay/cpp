title: "[Review] "
labels: ["review"]
body:
  - type: markdown
    attributes:
      value: |
        **Bring a problem to a Practice Room review.** Two problems a call, 20 minutes each: five to present, fifteen for questions. A reviewer who knows supply is asked first. The format is on https://cpp.anacay.org/community/#reviews.

        **This thread is public.** Read https://cpp.anacay.org/sharing-safely/ before you write anything. Use shape, indexed numbers (100 = plan) and banded ranges. Never absolute figures, names, contract terms or internal system names.

        **Prefer to keep it private?** Write to cpp@anacay.org instead, with the same headings. Private intake is the default for anything you are unsure about.

        Every problem gets a private pre-check before it reaches a call. A pre-check reviewer replies in writing within 72 hours. You can withdraw at any point.
  - type: input
    id: setting
    attributes:
      label: Setting, in general terms
      description: Your sector and the kind of fleet. No employer needed.
      placeholder: "Illustrative: a mid-size cloud, planning an accelerator fleet"
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: The decision, and when it is due
      description: What has to be decided, by whom, and by what date or stage.
      placeholder: "Illustrative: who gets a scarce accelerator block next quarter, decided at the monthly review before the commit date."
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: The shape of the problem
      description: Indexed or banded numbers only. Label every invented number illustrative.
      placeholder: "Illustrative: asks total 160 (100 = plan). Supply can firm 100 by the commit date and the rest 26–40 weeks later."
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you have tried, or are leaning towards
  - type: textarea
    id: ask
    attributes:
      label: What you want from the room
      description: One or two questions you want peers to answer.
    validations:
      required: true
  - type: dropdown
    id: supply
    attributes:
      label: Does supply shape the problem?
      description: A reviewer who knows supply reads these first.
      options:
        - "Yes: lead times, power, space or vendor terms"
        - "Partly"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: dropdown
    id: slot
    attributes:
      label: Which call slot suits you?
      options:
        - "17:00 UTC"
        - "00:00 UTC"
        - "Either"
        - "Neither: a written review is fine"
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Before you post
      options:
        - label: I read Sharing safely. Nothing here is confidential to an employer, client or vendor.
          required: true
        - label: No company, product, team, system, site or people names, unless already public and cited.
          required: true
        - label: Numbers are indexed, banded or illustrative, and labeled as such.
          required: true
        - label: I post in a personal capacity, not for my employer.
          required: true
