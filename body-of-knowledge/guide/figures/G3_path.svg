<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The path on the handshake triangle</title><desc id="d">The handshake triangle: capital at the top, demand at the bottom left, supply at the bottom right. A career path starts near demand with Learning (one service and one launch, weekly to monthly), moves toward the middle with Practicing (the portfolio, monthly to quarterly, with the commit points), and reaches Leading at the centre (the envelope and region, annual and quarterly, holding the decision rights). From there it forks: across to Capital (budgets, the envelope, strategic bets), or across to Supply (sites, power, contracts, lead times). Argued from experience; not measured.</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<path d="M360,120 L60,640 L660,640 Z" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="360" cy="120" r="9" fill="#1F2933" stroke="none"/>
<text x="360" y="74" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">Capital</text>
<text x="360" y="98" font-size="15" fill="#3E4C59" text-anchor="middle">funds it</text>
<circle cx="60" cy="640" r="9" fill="#1F2933" stroke="none"/>
<text x="60" y="674" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">Demand</text>
<text x="60" y="698" font-size="15" fill="#3E4C59" text-anchor="middle">uses it</text>
<circle cx="660" cy="640" r="9" fill="#1F2933" stroke="none"/>
<text x="660" y="674" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">Supply</text>
<text x="660" y="698" font-size="15" fill="#3E4C59" text-anchor="middle">builds it</text>
<polyline points="60,640 180,560 270,480 360,400" fill="none" stroke="#0B63C4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360,386 L360,168" fill="none" stroke="#0B63C4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M360,160 L365,170 L355,170 Z" fill="#0B63C4" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M372,410 L607.78,600.96" fill="none" stroke="#0B63C4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M614,606 L603.08,603.59 L609.38,595.82 Z" fill="#0B63C4" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="180" cy="560" r="14" fill="#0B63C4" stroke="none"/>
<text x="180" y="566" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">1</text>
<circle cx="270" cy="480" r="14" fill="#0B63C4" stroke="none"/>
<text x="270" y="486" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">2</text>
<circle cx="360" cy="400" r="14" fill="#0B63C4" stroke="none"/>
<text x="360" y="406" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">3</text>
<circle cx="360" cy="190" r="14" fill="#0B63C4" stroke="none"/>
<text x="360" y="196" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">4</text>
<circle cx="590" cy="590" r="14" fill="#0B63C4" stroke="none"/>
<text x="590" y="596" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">5</text>
<text x="700" y="130" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">4  Capital</text>
<text x="700" y="154" font-size="15" fill="#3E4C59"><tspan x="700" dy="0">Crosses to funding: budgets, the</tspan><tspan x="700" dy="19.5">envelope, strategic bets</tspan></text>
<text x="700" y="265" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">3  Leading</text>
<text x="700" y="289" font-size="15" fill="#3E4C59"><tspan x="700" dy="0">Envelope and region; annual and</tspan><tspan x="700" dy="19.5">quarterly; holds the decision</tspan><tspan x="700" dy="19.5">rights</tspan></text>
<text x="700" y="400" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">2  Practicing</text>
<text x="700" y="424" font-size="15" fill="#3E4C59"><tspan x="700" dy="0">The portfolio and the commit</tspan><tspan x="700" dy="19.5">points; monthly to quarterly</tspan></text>
<text x="700" y="520" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">1  Learning</text>
<text x="700" y="544" font-size="15" fill="#3E4C59"><tspan x="700" dy="0">One service, one launch; weekly</tspan><tspan x="700" dy="19.5">to monthly</tspan></text>
<text x="700" y="630" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">5  Supply</text>
<text x="700" y="654" font-size="15" fill="#3E4C59"><tspan x="700" dy="0">Crosses to building: sites, power,</tspan><tspan x="700" dy="19.5">contracts, lead times</tspan></text>
<text x="360" y="740" font-size="15" fill="#3E4C59" text-anchor="middle">The broker's path runs up the middle, then forks to either corner</text>
<text x="936" y="762" font-size="15" fill="#3E4C59" text-anchor="end">Argued from experience</text>
</svg>
