<text x="226" y="140" font-size="15" fill="#1F2933"><tspan x="226" dy="0">Set the envelope and cut</tspan><tspan x="226" dy="19.5">line; strategic bets on</tspan><tspan x="226" dy="19.5">demand</tspan></text>
<text x="434" y="140" font-size="15" fill="#1F2933"><tspan x="434" dy="0">Re-plan the envelope</tspan><tspan x="434" dy="19.5">against actuals</tspan></text>
<text x="642" y="140" font-size="15" fill="#1F2933"><tspan x="642" dy="0">Move the cut line; track</tspan><tspan x="642" dy="19.5">spend against plan</tspan></text>
<text x="850" y="140" font-size="15" fill="#1F2933"><tspan x="850" dy="0">Overrides decided and</tspan><tspan x="850" dy="19.5">logged by the forum</tspan></text>
<text x="1058" y="140" font-size="15" fill="#1F2933"><tspan x="1058" dy="0">Restate; re-baseline after</tspan><tspan x="1058" dy="19.5">a shock</tspan></text>
<text x="226" y="270" font-size="15" fill="#1F2933"><tspan x="226" dy="0">Land, power, building</tspan><tspan x="226" dy="19.5">shells; long-haul</tspan><tspan x="226" dy="19.5">network</tspan></text>
<text x="434" y="270" font-size="15" fill="#1F2933"><tspan x="434" dy="0">Machines and parts;</tspan><tspan x="434" dy="19.5">placement plan</tspan></text>
<text x="642" y="270" font-size="15" fill="#1F2933"><tspan x="642" dy="0">Pool machines;</tspan><tspan x="642" dy="19.5">turn-up slots; arrivals</tspan></text>
<text x="850" y="270" font-size="15" fill="#1F2933"><tspan x="850" dy="0">Job placement;</tspan><tspan x="850" dy="19.5">bridges; moves</tspan></text>
<text x="1058" y="270" font-size="15" fill="#1F2933"><tspan x="1058" dy="0">Reclaim stranded and</tspan><tspan x="1058" dy="19.5">expired capacity</tspan></text>
<text x="226" y="400" font-size="15" fill="#1F2933"><tspan x="226" dy="0">Intents enter at a share</tspan><tspan x="226" dy="19.5">of the envelope</tspan></text>
<text x="434" y="400" font-size="15" fill="#1F2933"><tspan x="434" dy="0">Forecast in driver units;</tspan><tspan x="434" dy="19.5">supply review</tspan></text>
<text x="642" y="400" font-size="15" fill="#1F2933"><tspan x="642" dy="0">Re-rank against supply;</tspan><tspan x="642" dy="19.5">grants; fulfillment ledger</tspan></text>
<text x="850" y="400" font-size="15" fill="#1F2933"><tspan x="850" dy="0">Arbitrate, broker,</tspan><tspan x="850" dy="19.5">escalate</tspan></text>
<text x="1058" y="400" font-size="15" fill="#1F2933"><tspan x="1058" dy="0">Variance by owner;</tspan><tspan x="1058" dy="19.5">score declarations</tspan></text>
<text x="226" y="530" font-size="15" fill="#1F2933"><tspan x="226" dy="0">Intent: a size range, a</tspan><tspan x="226" dy="19.5">year</tspan></text>
<text x="434" y="530" font-size="15" fill="#1F2933"><tspan x="434" dy="0">Dated: base and high</tspan><tspan x="434" dy="19.5">scenarios</tspan></text>
<text x="642" y="530" font-size="15" fill="#1F2933"><tspan x="642" dy="0">Configured: regions,</tspan><tspan x="642" dy="19.5">shapes, ramp</tspan></text>
<text x="850" y="530" font-size="15" fill="#1F2933">Pre-launch tests; launch</text>
<text x="1058" y="530" font-size="15" fill="#1F2933">Live, then organic</text>
<text x="226" y="660" font-size="15" fill="#1F2933"><tspan x="226" dy="0">Efficiency commitment</tspan><tspan x="226" dy="19.5">signed</tspan></text>
<text x="434" y="660" font-size="15" fill="#1F2933"><tspan x="434" dy="0">Coefficient and rate card</tspan><tspan x="434" dy="19.5">versioned</tspan></text>
<text x="642" y="660" font-size="15" fill="#1F2933"><tspan x="642" dy="0">Shape, place and time</tspan><tspan x="642" dy="19.5">checked</tspan></text>
<text x="850" y="660" font-size="15" fill="#1F2933"><tspan x="850" dy="0">Tuning; admission</tspan><tspan x="850" dy="19.5">control</tspan></text>
<text x="1058" y="660" font-size="15" fill="#1F2933"><tspan x="1058" dy="0">Two alerts; the next</tspan><tspan x="1058" dy="19.5">coefficient</tspan></text>
