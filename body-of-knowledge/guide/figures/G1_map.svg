<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 925" width="100%" role="img" aria-labelledby="t d" data-canvas="pullout" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The map: altitude by cadence</title><desc id="d">A grid. Columns are the planning cadence, left to right: annual, quarterly, monthly, weekly and post-launch, with an arrow from post-launch back to annual because actuals feed the next plan. Rows are altitudes, high to low: envelope (capital and the fleet), region or site, portfolio (all launches), launch (one product) and unit (one service). Each cell names the work at that altitude and cadence. Dots mark supply commit points: land, power and shells annually; machines and parts quarterly; turn-up slots monthly; job placement and bridges weekly. Schematic.</desc><rect x="0" y="0" width="1280" height="925" fill="#FFFFFF"/>
<text x="226" y="58" font-size="17" fill="#1F2933" font-weight="600">Annual</text>
<text x="226" y="82" font-size="15" fill="#3E4C59">years out</text>
<text x="434" y="58" font-size="17" fill="#1F2933" font-weight="600">Quarterly</text>
<text x="434" y="82" font-size="15" fill="#3E4C59">quarters out</text>
<text x="642" y="58" font-size="17" fill="#1F2933" font-weight="600">Monthly</text>
<text x="642" y="82" font-size="15" fill="#3E4C59">weeks to months</text>
<text x="850" y="58" font-size="17" fill="#1F2933" font-weight="600">Weekly</text>
<text x="850" y="82" font-size="15" fill="#3E4C59">days to weeks</text>
<text x="1058" y="58" font-size="17" fill="#1F2933" font-weight="600">Post-launch</text>
<text x="1058" y="82" font-size="15" fill="#3E4C59">after it lands</text>
<text x="24" y="142" font-size="17" fill="#1F2933" font-weight="600">Envelope</text>
<text x="24" y="166" font-size="15" fill="#3E4C59">capital, fleet</text>
<text x="24" y="272" font-size="17" fill="#1F2933" font-weight="600">Region / site</text>
<text x="24" y="296" font-size="15" fill="#3E4C59">place</text>
<text x="24" y="402" font-size="17" fill="#1F2933" font-weight="600">Portfolio</text>
<text x="24" y="426" font-size="15" fill="#3E4C59">all launches</text>
<text x="24" y="532" font-size="17" fill="#1F2933" font-weight="600">Launch</text>
<text x="24" y="556" font-size="15" fill="#3E4C59">one product</text>
<text x="24" y="662" font-size="17" fill="#1F2933" font-weight="600">Unit</text>
<text x="24" y="686" font-size="15" fill="#3E4C59">one service</text>
