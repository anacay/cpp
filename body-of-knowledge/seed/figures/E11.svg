<text x="40" y="517" font-size="15" fill="#3E4C59"><tspan x="40" dy="0">A retirement is a supply order with a minus sign: it has</tspan><tspan x="40" dy="19.5">a date, and it slips. Old racks must leave before new</tspan><tspan x="40" dy="19.5">ones can use their power and floor, so a slipped</tspan><tspan x="40" dy="19.5">decommission can stall a delivery that arrived on time.</tspan></text>
