<text x="488" y="642" font-size="15" fill="#3E4C59"><tspan x="488" dy="0">Four sites with independent risks usually deliver most of what</tspan><tspan x="488" dy="19.5">was promised; four that wait on one supplier slip together.</tspan></text>
