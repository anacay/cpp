<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Supply firms up, and slips, in steps of its own</title><desc id="d">Two parts. At the top, demand's stages (Intent, Dated, Configured, Live, Organic) mirror supply's (planned, contracted, under construction, delivered, live), with both scored on promised against actual size and date by stage (mechanisms 2 and 11); a planner who discounts demand intents but takes supply promises at face value has half an outside view. Below, a chain: a late transformer delays the building, then every rack and turn-up committed on the old date, and the slipped batches queue at turn-up together, so a slip often shows up twice. Side notes: decommission is negative supply [2], so a slipped retirement can stall an on-time delivery; and four sites that wait on one transformer supplier or utility slip together. A footer says a supply slip is an envelope change in time, handled as a re-cut. Schematic.</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<text x="24" y="66" font-size="15" fill="#1F2933" font-weight="600">Demand declares</text>
