<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The challenge channel</title><desc id="d">Swimlane flowchart in three lanes: the consuming team, the forum (run by planning), and the service owner with finance. The service owner publishes the coefficient and rate with a version, an effective date, an owner and a valid range (mechanism 3). The consuming team, which needs its own coefficient, reproducible from its telemetry, challenges a coefficient. The forum rules on the challenge (mechanism 10), reading the published version, as it ruled on a new driver in Section 7. A diamond asks whether the challenge wins. If not, the published version stays in use. If so, the service owner restates the history per service, or re-fits, and a new version takes effect from its effective date, not retroactively. A strip shows the record it leaves: the ruling in the forum's decision log (mechanism 10); if the challenge wins, the new version and its effective date in the coefficient register and rate card's change log (mechanism 3), and the cause in the discontinuity register (mechanism 6). Notes say that who pays a coefficient term is a separate rule, agreed with finance before the miss; that planning publishes the same indicators about the infrastructure organization's coefficients as about consumers' forecasts; and that a consumer who can challenge a coefficient, and sometimes wins, trusts the rest of the bill, one of Ostrom's design principles for durable commons [97].</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
