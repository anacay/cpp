<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">One coefficient, two readings</title><desc id="d">Flow diagram: Products A and B feed a front-end tier, which calls Service X (0.4 × 2.5 ms) and Service Y (0.1 × 5 ms). Product C calls Service Y directly (0.2 × 1 ms), and replication links X to Y. A solid arrow reads the coefficient forward as a load forecast; Product A's coefficient at Service X is 0.4 × 2.5 = 1.0 ms per request. A dashed arrow reads it backward as a price charged to the causer. Below, Cost = V × α × r, with owners for volume, coefficient and rate. Forward, 1,000 requests per second keeps one core busy; backward, each extra 1,000 is about $1,051 a year at the illustrative rate. Service Y and Products B and C are illustrative.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="46" font-size="17" fill="#0B63C4" font-weight="600">Read forward: traffic × α → service load, at the coincident peak</text>
<text x="24" y="68" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1">1,000 req/s → 1 busy core;  +100,000 req/s → +100 busy cores</text>
