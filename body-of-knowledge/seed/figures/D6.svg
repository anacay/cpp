<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Who keeps each term true</title><desc id="d">Six role cards around the cost formula, Cost = V × α × r, with the promises Section 14 lists. Product leaders confirm the pre-filled intake, sign what they change, and declare step changes in stages, slow attributes first. Platform leaders publish each material coefficient and rate with an owner and a change log, and own the unused and unallocated lines. Finance declares what fully loaded contains and agrees in advance the landing rule, the shortage-to-idle ratios, the re-cut order and who pays when a coefficient regresses or a change falls outside the bands. Planning keeps the fulfillment ledger, carries the gap and walks each step change through the commit-point method. A standing forum owns the ranked list and the cut line. Supply chain answers every approved ask with a dated commit or a named gap, sets change bands and keeps the commit-point map with planning, declares its own step changes in stages, and is scored on promised against actual.</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<rect x="24" y="23.5" width="294.67" height="259.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(38,37.5) scale(1.08)" fill="none" stroke="#1F2933" stroke-width="1.61" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="9" r="3.2"/><path d="M6.3,19 C7,14.6 17,14.6 17.7,19"/>
</g>
<text x="74" y="56.5" font-size="17" fill="#1F2933" font-weight="600">Product leaders</text>
<circle cx="42" cy="85.5" r="2.5" fill="#616E7C" stroke="none"/>
<text x="52" y="90.5" font-size="15" fill="#1F2933"><tspan x="52" dy="0">confirm the pre-filled intake (last</tspan><tspan x="52" dy="19.5">year's ask beside its actual)</tspan></text>
<circle cx="42" cy="129.6" r="2.5" fill="#616E7C" stroke="none"/>
<text x="52" y="134.6" font-size="15" fill="#1F2933">sign what they change</text>
<circle cx="42" cy="154.2" r="2.5" fill="#616E7C" stroke="none"/>
<text x="52" y="159.2" font-size="15" fill="#1F2933"><tspan x="52" dy="0">declare step changes in stages,</tspan><tspan x="52" dy="19.5">slow attributes first</tspan></text>
<text x="38" y="265" font-size="15" fill="#3E4C59">keeps V true: declares the volume</text>
<rect x="332.67" y="23.5" width="294.67" height="259.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(346.67,37.5) scale(1.08)" fill="none" stroke="#1F2933" stroke-width="1.61" stroke-linecap="round" stroke-linejoin="round">
<polygon points="21.53,17.50 12.00,23.00 2.47,17.50 2.47,6.50 12.00,1.00 21.53,6.50"/><path d="M8,8.5 H16 M8,12 H16 M8,15.5 H16" stroke-width="2.03"/>
</g>
<text x="382.67" y="56.5" font-size="17" fill="#1F2933" font-weight="600">Platform leaders</text>
<circle cx="350.67" cy="85.5" r="2.5" fill="#616E7C" stroke="none"/>
<text x="360.67" y="90.5" font-size="15" fill="#1F2933"><tspan x="360.67" dy="0">publish each material coefficient</tspan><tspan x="360.67" dy="19.5">and rate with an owner and a</tspan><tspan x="360.67" dy="19.5">change log</tspan></text>
<circle cx="350.67" cy="149.1" r="2.5" fill="#616E7C" stroke="none"/>
<text x="360.67" y="154.1" font-size="15" fill="#1F2933"><tspan x="360.67" dy="0">own the unused and unallocated</tspan><tspan x="360.67" dy="19.5">lines</tspan></text>
<text x="346.67" y="265" font-size="15" fill="#3E4C59">keeps α true, and r with finance</text>
<rect x="641.33" y="23.5" width="294.67" height="259.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(655.33,37.5) scale(1.08)" fill="none" stroke="#1F2933" stroke-width="1.61" stroke-linecap="round" stroke-linejoin="round">
<rect x="2.5" y="2.5" width="19" height="19" rx="1"/>
<path d="M15,8.6 C14.2,6.9 9,6.6 9,9.5 C9,12.3 15,11.4 15,14.5 C15,17.5 9.6,17.3 8.8,15.4 M12,5 V19"/>
</g>
<text x="691.33" y="56.5" font-size="17" fill="#1F2933" font-weight="600">Finance</text>
<circle cx="659.33" cy="85.5" r="2.5" fill="#616E7C" stroke="none"/>
<text x="669.33" y="90.5" font-size="15" fill="#1F2933"><tspan x="669.33" dy="0">declares what "fully loaded"</tspan><tspan x="669.33" dy="19.5">contains</tspan></text>
<circle cx="659.33" cy="129.6" r="2.5" fill="#616E7C" stroke="none"/>
<text x="669.33" y="134.6" font-size="15" fill="#1F2933"><tspan x="669.33" dy="0">agrees in advance: the landing</tspan><tspan x="669.33" dy="19.5">rule; the shortage-to-idle ratios;</tspan><tspan x="669.33" dy="19.5">the re-cut order; who pays when a</tspan><tspan x="669.33" dy="19.5">shared service's own coefficient</tspan><tspan x="669.33" dy="19.5">regresses; who pays for a change</tspan><tspan x="669.33" dy="19.5">outside the agreed change bands</tspan></text>
<text x="655.33" y="265" font-size="15" fill="#3E4C59">sets r with the service owner</text>
<rect x="24" y="299" width="912" height="96" rx="6" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="1.25"/>
<text x="38" y="346" font-size="19" fill="#1F2933" font-weight="600">Cost =</text>
<text x="171.33" y="347" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">V</text>
<line x1="171.33" y1="299" x2="171.33" y2="325" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="round"/>
<text x="480" y="347" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">α</text>
<line x1="480" y1="299" x2="480" y2="325" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="round"/>
<text x="788.67" y="347" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">r</text>
<line x1="788.67" y1="299" x2="788.67" y2="325" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="round"/>
<text x="325.67" y="346" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">×</text>
<text x="634.33" y="346" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">×</text>
<text x="480" y="379" font-size="15" fill="#3E4C59" text-anchor="middle">A coefficient is an agreement among them. Write their names down, version what they agreed, and the arithmetic binds.</text>
<rect x="24" y="411" width="294.67" height="355.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(38,425) scale(1.08)" fill="none" stroke="#1F2933" stroke-width="1.61" stroke-linecap="round" stroke-linejoin="round">
<path d="M4,6 H17.5 L22.5,12 L17.5,18 H4 Q2,18 2,16 V8 Q2,6 4,6 Z"/><circle cx="18" cy="12" r="1.3"/>
<path d="M5,18 V13.5 M8,18 V15 M11,18 V13.5 M14,18 V15"/>
</g>
<text x="74" y="444" font-size="17" fill="#1F2933" font-weight="600">Planning</text>
<circle cx="42" cy="473" r="2.5" fill="#616E7C" stroke="none"/>
<text x="52" y="478" font-size="15" fill="#1F2933">keeps the fulfillment ledger</text>
<circle cx="42" cy="497.6" r="2.5" fill="#616E7C" stroke="none"/>
<text x="52" y="502.6" font-size="15" fill="#1F2933">carries the gap</text>
<circle cx="42" cy="522.2" r="2.5" fill="#616E7C" stroke="none"/>
<text x="52" y="527.2" font-size="15" fill="#1F2933"><tspan x="52" dy="0">walks each step change through</tspan><tspan x="52" dy="19.5">the commit-point method (Section</tspan><tspan x="52" dy="19.5">8)</tspan></text>
<text x="38" y="729" font-size="15" fill="#3E4C59"><tspan x="38" dy="0">carries the gap: approved vs</tspan><tspan x="38" dy="19.5">delivered, declared vs known</tspan></text>
<rect x="332.67" y="411" width="294.67" height="355.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(346.67,425) scale(1.08)" fill="none" stroke="#1F2933" stroke-width="1.61" stroke-linecap="round" stroke-linejoin="round">
<path d="M4.5,19.5 A7.5,7.5 0 0 1 19.5,19.5 Z"/>
<circle cx="3.08" cy="14.35" r="2"/>
<circle cx="12.00" cy="9.20" r="2"/>
<circle cx="20.92" cy="14.35" r="2"/>
</g>
<text x="382.67" y="444" font-size="17" fill="#1F2933" font-weight="600">A standing forum</text>
<circle cx="350.67" cy="473" r="2.5" fill="#616E7C" stroke="none"/>
<text x="360.67" y="478" font-size="15" fill="#1F2933"><tspan x="360.67" dy="0">owns the ranked list and the cut</tspan><tspan x="360.67" dy="19.5">line</tspan></text>
<rect x="641.33" y="411" width="294.67" height="355.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
