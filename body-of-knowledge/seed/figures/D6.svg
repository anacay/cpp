</g>
<text x="691.33" y="444" font-size="17" fill="#1F2933" font-weight="600">Supply chain</text>
<circle cx="659.33" cy="473" r="2.5" fill="#616E7C" stroke="none"/>
<text x="669.33" y="478" font-size="15" fill="#1F2933"><tspan x="669.33" dy="0">answers every approved ask with a</tspan><tspan x="669.33" dy="19.5">dated commit or a named gap</tspan></text>
<circle cx="659.33" cy="517.1" r="2.5" fill="#616E7C" stroke="none"/>
<text x="669.33" y="522.1" font-size="15" fill="#1F2933">sets change bands with planning</text>
<circle cx="659.33" cy="541.7" r="2.5" fill="#616E7C" stroke="none"/>
<text x="669.33" y="546.7" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1"><tspan x="669.33" dy="0">declares its own step changes in</tspan><tspan x="669.33" dy="19.5">stages (Section 6.7)</tspan></text>
<circle cx="659.33" cy="585.8" r="2.5" fill="#616E7C" stroke="none"/>
<text x="669.33" y="590.8" font-size="15" fill="#1F2933"><tspan x="669.33" dy="0">keeps the commit-point map with</tspan><tspan x="669.33" dy="19.5">planning</tspan></text>
<circle cx="659.33" cy="629.9" r="2.5" fill="#616E7C" stroke="none"/>
<text x="669.33" y="634.9" font-size="15" fill="#1F2933"><tspan x="669.33" dy="0">is scored on promised against</tspan><tspan x="669.33" dy="19.5">actual, as demand is scored on</tspan><tspan x="669.33" dy="19.5">how much it changed inside</tspan><tspan x="669.33" dy="19.5">supply's lead time</tspan></text>
<text x="655.33" y="729" font-size="15" fill="#3E4C59"><tspan x="655.33" dy="0">answers each ask with a date or a</tspan><tspan x="655.33" dy="19.5">named gap</tspan></text>
</svg>
