<text x="24" y="46" font-size="19" fill="#1F2933" font-weight="600">(a) Cautious lead time</text>
<text x="24" y="70" font-size="15" fill="#3E4C59">For example, if machines usually take one quarter but one order in five takes two.</text>
<text x="24" y="90" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">Need date −2 (as in Appendix A): usual commit −5, cautious −8.</text>
