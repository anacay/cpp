<text x="748" y="107" font-size="15" fill="#3E4C59"><tspan x="748" dy="0">In my experience: late</tspan><tspan x="748" dy="19.5">arrivals common, early</tspan><tspan x="748" dy="19.5">ones rare.</tspan></text>
<text x="24" y="262" font-size="19" fill="#1F2933" font-weight="600">(b) Layers stack</text>
<text x="24" y="286" font-size="15" fill="#3E4C59">A layer's need date is the next layer's start, not launch day.</text>
