<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Finding a commit point: cautious, stacked, queued</title><desc id="d">Three panels. (a) Five orders placed at −5: four arrive in one quarter, one in two, so plan on two and commit at −8 for a need date of −2; in my experience, late arrivals are common and early ones rare. (b) Hall, machines (two quarters, −8 to −2), turn-up and load tests run as a relay; each layer is needed when the next starts, not at launch. (c) Four halls at two weeks each, two at a time, take a month; a slipped batch of four more waits a month longer. Hypothetical values.</desc><defs><pattern id="k-hatch-tail" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#616E7C" stroke-width="1.3"/></pattern><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern></defs><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
