<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The hotel: three prices, three questions</title><desc id="d">Three hotel scenes. A ledger gives each guest's share of the year's bill: the average loaded rate, which answers who pays. A new wing's cost per room: long-run incremental cost, which answers whether to build. The last room on a sold-out night is worth what the turned-away guest would pay: the shadow price, which answers who gets scarce capacity; on a half-empty night it is near zero.</desc><defs><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
