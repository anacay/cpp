<text x="24" y="50" font-size="19" fill="#1F2933" font-weight="600">A room-night's fair share</text>
<text x="24" y="252" font-size="15" fill="#3E4C59"><tspan x="24" dy="0">The year's bill ÷ the room-nights it can</tspan><tspan x="24" dy="19.5">sell</tspan></text>
<text x="24" y="300" font-size="17" fill="#1F2933" font-weight="600">→ average loaded rate</text>
<rect x="24" y="314" width="115.31" height="30" rx="15" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.25"/>
<text x="36" y="335" font-size="17" fill="#1F2933" font-weight="600">Who pays?</text>
<text x="332" y="50" font-size="19" fill="#1F2933" font-weight="600">A new wing</text>
<text x="332" y="252" font-size="15" fill="#3E4C59">Its cost per room added</text>
<text x="332" y="300" font-size="17" fill="#1F2933" font-weight="600">→ long-run incremental cost</text>
<rect x="332" y="314" width="163.91" height="30" rx="15" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.25"/>
<text x="344" y="335" font-size="17" fill="#1F2933" font-weight="600">Should we build?</text>
<text x="640" y="50" font-size="19" fill="#1F2933" font-weight="600">The last room, sold-out night</text>
<text x="640" y="252" font-size="15" fill="#3E4C59"><tspan x="640" dy="0">Worth what the turned-away guest</tspan><tspan x="640" dy="19.5">would have paid</tspan></text>
<text x="640" y="300" font-size="17" fill="#1F2933" font-weight="600">→ shadow price</text>
<rect x="640" y="314" width="165.66" height="30" rx="15" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.25"/>
<text x="652" y="335" font-size="17" fill="#1F2933" font-weight="600">Who gets it now?</text>
<text x="640" y="372" font-size="15" fill="#3E4C59"><tspan x="640" dy="0">Half-empty night: one more guest costs</tspan><tspan x="640" dy="19.5">little more than clean sheets (shadow</tspan><tspan x="640" dy="19.5">price ≈ zero)</tspan></text>
<line x1="24" y1="432" x2="936" y2="432" stroke="#CBD2D9" stroke-width="1.25" stroke-linecap="butt"/>
<text x="24" y="457" font-size="15" fill="#3E4C59">In the scene → in capacity terms:</text>
<text x="273.15" y="457" font-size="15" fill="#3E4C59">hotel</text>
<text x="308.3" y="457" font-size="15" fill="#3E4C59"> → </text>
<text x="331.04" y="457" font-size="15" fill="#1F2933" font-weight="600">shared pool</text>
<text x="430.58" y="457" font-size="15" fill="#3E4C59" text-anchor="middle">·</text>
<text x="444.58" y="457" font-size="15" fill="#3E4C59">room-night</text>
<text x="523.73" y="457" font-size="15" fill="#3E4C59"> → </text>
<text x="546.47" y="457" font-size="15" fill="#1F2933" font-weight="600">unit of capacity</text>
<text x="672.7" y="457" font-size="15" fill="#3E4C59" text-anchor="middle">·</text>
<text x="686.7" y="457" font-size="15" fill="#3E4C59">wing</text>
<text x="720.66" y="457" font-size="15" fill="#3E4C59"> → </text>
<text x="743.4" y="457" font-size="15" fill="#1F2933" font-weight="600">next increment of supply</text>
<text x="24" y="481" font-size="15" fill="#3E4C59">last room</text>
<text x="89.88" y="481" font-size="15" fill="#3E4C59"> → </text>
<text x="112.62" y="481" font-size="15" fill="#1F2933" font-weight="600">the binding resource</text>
