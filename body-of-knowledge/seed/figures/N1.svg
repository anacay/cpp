<text x="61" y="324" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">25</text>
<line x1="65" y1="254" x2="70" y2="254" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="butt"/>
<text x="61" y="259" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">50</text>
<line x1="65" y1="189" x2="70" y2="189" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="butt"/>
<text x="61" y="194" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">75</text>
<line x1="65" y1="124" x2="70" y2="124" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="butt"/>
<text x="61" y="129" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">100</text>
<text x="24" y="104" font-size="15" fill="#3E4C59">thousand rps</text>
<rect x="104" y="319" width="96" height="65" fill="#CBD2D9" stroke="#616E7C" stroke-width="1" data-cat="slice0" data-cue="label"/>
<text x="152" y="356.5" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1">launch 1: 25</text>
<rect x="104" y="254" width="96" height="65" fill="#E4E7EB" stroke="#616E7C" stroke-width="1" data-cat="slice1" data-cue="label"/>
<text x="152" y="291.5" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1">launch 2: 25</text>
<rect x="104" y="189" width="96" height="65" fill="#CBD2D9" stroke="#616E7C" stroke-width="1" data-cat="slice0" data-cue="label"/>
<text x="152" y="226.5" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1">launch 3: 25</text>
<rect x="104" y="124" width="96" height="65" fill="#E4E7EB" stroke="#616E7C" stroke-width="1" data-cat="slice1" data-cue="label"/>
<text x="152" y="161.5" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1">launch 4: 25</text>
<path d="M208,124 H216 V384 H208 M216,254 H221" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="228" y="248" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">100 in all:</text>
<text x="228" y="270" font-size="15" fill="#3E4C59">a sum of peaks</text>
<line x1="440" y1="40" x2="440" y2="412" stroke="#E4E7EB" stroke-width="1.25" stroke-linecap="butt"/>
