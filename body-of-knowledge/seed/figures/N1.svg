<text x="462" y="104" font-size="15" fill="#3E4C59">total needed, and how often</text>
<line x1="702" y1="124" x2="802" y2="124" stroke="#8A96A3" stroke-width="1.25" stroke-dasharray="5 4" stroke-linecap="butt"/>
<text x="806" y="129" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">100 if held apart</text>
<rect x="720" y="189" width="64" height="195" fill="url(#k-hatch-blue)" stroke="#0B63C4" stroke-width="1.5" data-cat="pooled" data-cue="pattern"/>
<text x="796" y="194" font-size="17" fill="#0B63C4" font-weight="600" style="font-feature-settings:'tnum' 1">pooled: 75</text>
<text x="796" y="216" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">15 of 16 outcomes</text>
<text x="796" y="259" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">50 covers 11 of 16,</text>
<text x="796" y="279" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">under the 80th</text>
<text x="752" y="404" font-size="15" fill="#3E4C59" text-anchor="middle" style="font-feature-settings:'tnum' 1">80th percentile</text>
<line x1="702" y1="384" x2="802" y2="384" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="butt"/>
