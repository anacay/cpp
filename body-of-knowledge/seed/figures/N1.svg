<text x="38" y="454" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">Tied to one driver: they land together, so the pooled reserve is 100.</text>
<text x="24" y="508" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">Peak of sums, after [7]; plan for only some launches [6]</text>
