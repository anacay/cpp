<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">A pooled launch reserve</title><desc id="d">Two panels on one scale, in thousand requests per second. Separate reserves: four launches each hold a 25,000 high slice, 100,000 in all. One pooled reserve: with each launch independently half likely to need its slice, the outcomes 0, 25, 50, 75 and 100 thousand occur 1, 4, 6, 4 and 1 times in 16. Fifty thousand covers 11 of 16, under the 80th percentile; 75,000 covers 15 of 16, so the 80th percentile is 75,000. A strip notes that launches tied to one driver land together and need all 100,000. Peak of sums, after [7]; planning for only some launches [6]. Illustrative.</desc><defs><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="44" font-size="19" fill="#1F2933" font-weight="600">(a) Separate reserves</text>
<text x="24" y="68" font-size="15" fill="#3E4C59">each launch holds its own high slice</text>
<line x1="70" y1="384" x2="70" y2="118" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="butt"/>
<line x1="65" y1="384" x2="70" y2="384" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="butt"/>
<text x="61" y="389" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">0</text>
