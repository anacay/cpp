<text x="491" y="129" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">100</text>
<rect x="508" y="377" width="15" height="14" fill="#3E4C59" stroke="none"/>
<text x="531" y="389" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">1 in 16</text>
