<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-labelledby="t d" data-canvas="band" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Three numbers, three owners</title><desc id="d">Equation card: cost equals volume times coefficient times rate. Volume is owned by the product team and moves with its product. The coefficient is owned by the shared service and moves with code, cache behavior, request mix, data size and hardware. The rate is owned by the service owner with finance and moves with its cost structure. Example: 0.4 calls at 2.5 ms gives 1.0 ms per request, at $0.12 per busy core-hour. Illustrative numbers.</desc><rect x="0" y="0" width="960" height="340" fill="#FFFFFF"/>
<text x="24" y="70" font-size="19" fill="#1F2933" font-weight="600">Cost =</text>
<rect x="98.29" y="28" width="256.57" height="244" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.5"/>
<text x="112.29" y="58" font-size="19" fill="#1F2933" font-weight="600">V</text>
<text x="136.29" y="58" font-size="17" fill="#1F2933" font-weight="600">driver (volume)</text>
<text x="112.29" y="82" font-size="15" fill="#3E4C59"><tspan x="112.29" dy="0">what causes load: how much</tspan><tspan x="112.29" dy="19.5">the consumer does</tspan></text>
<g transform="translate(112.29,119.1) scale(1)" fill="none" stroke="#1F2933" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="9" r="3.2"/><path d="M6.3,19 C7,14.6 17,14.6 17.7,19"/>
</g>
<text x="144.29" y="136.35" font-size="15" fill="#1F2933">product team</text>
<text x="112.29" y="171.1" font-size="15" fill="#1F2933">moves with: its product</text>
<text x="112.29" y="238.5" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="112.29" dy="0">e.g. 500,000 requests per</tspan><tspan x="112.29" dy="19.5">second, declared</tspan></text>
<text x="371.86" y="70" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">×</text>
<rect x="388.86" y="28" width="256.57" height="244" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.25"/>
<text x="402.86" y="58" font-size="19" fill="#1F2933" font-weight="600">α</text>
<text x="426.86" y="58" font-size="17" fill="#1F2933" font-weight="600">coefficient</text>
<text x="402.86" y="82" font-size="15" fill="#3E4C59">resource used per unit of driver</text>
<g transform="translate(402.86,119.1) scale(1)" fill="none" stroke="#1F2933" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
<polygon points="21.53,17.50 12.00,23.00 2.47,17.50 2.47,6.50 12.00,1.00 21.53,6.50"/><path d="M8,8.5 H16 M8,12 H16 M8,15.5 H16" stroke-width="2.20"/>
</g>
<text x="434.86" y="136.35" font-size="15" fill="#1F2933">shared service</text>
<text x="402.86" y="171.1" font-size="15" fill="#1F2933"><tspan x="402.86" dy="0">moves with: code, cache</tspan><tspan x="402.86" dy="19.5">behavior, request mix, data size</tspan><tspan x="402.86" dy="19.5">and hardware</tspan></text>
<text x="402.86" y="238.5" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="402.86" dy="0">e.g. 0.4 calls × 2.5 ms = 1.0 ms</tspan><tspan x="402.86" dy="19.5">per request</tspan></text>
<text x="662.43" y="70" font-size="19" fill="#1F2933" text-anchor="middle" font-weight="600">×</text>
<rect x="679.43" y="28" width="256.57" height="244" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.25"/>
<text x="693.43" y="58" font-size="19" fill="#1F2933" font-weight="600">r</text>
<text x="717.43" y="58" font-size="17" fill="#1F2933" font-weight="600">rate</text>
<text x="693.43" y="82" font-size="15" fill="#3E4C59"><tspan x="693.43" dy="0">cost per unit of resource; by</tspan><tspan x="693.43" dy="19.5">default the average loaded rate</tspan></text>
<g transform="translate(693.43,119.1) scale(1)" fill="none" stroke="#1F2933" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
<polygon points="21.53,17.50 12.00,23.00 2.47,17.50 2.47,6.50 12.00,1.00 21.53,6.50"/><path d="M8,8.5 H16 M8,12 H16 M8,15.5 H16" stroke-width="2.20"/>
</g>
<text x="720.43" y="137.1" font-size="17" fill="#3E4C59">+</text>
<g transform="translate(735.43,119.1) scale(1)" fill="none" stroke="#1F2933" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
<rect x="2.5" y="2.5" width="19" height="19" rx="1"/>
<path d="M15,8.6 C14.2,6.9 9,6.6 9,9.5 C9,12.3 15,11.4 15,14.5 C15,17.5 9.6,17.3 8.8,15.4 M12,5 V19"/>
</g>
<text x="767.43" y="126.6" font-size="15" fill="#1F2933"><tspan x="767.43" dy="0">service owner, with</tspan><tspan x="767.43" dy="19.5">finance</tspan></text>
<text x="693.43" y="171.1" font-size="15" fill="#1F2933"><tspan x="693.43" dy="0">moves with: the service's cost</tspan><tspan x="693.43" dy="19.5">structure</tspan></text>
<text x="693.43" y="258" font-size="15" fill="#3E4C59">e.g. $0.12 per busy core-hour</text>
<path d="M104.29,280 V285 H348.86 V280 M226.57,285 V290" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="104.29" y="308" font-size="15" fill="#1F2933">what the team forecasts</text>
<path d="M394.86,280 V285 H930 V280 M662.43,285 V290" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="394.86" y="308" font-size="15" fill="#1F2933">two of the three belong to someone else</text>
<text x="936" y="312" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">Illustrative numbers (Section 7)</text>
</svg>
