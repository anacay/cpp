<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Every step down the chain spends fungibility</title><desc id="d">A chain from powered land, which can serve almost any launch, to a shell with a cooling design, which serves fewer, to a tested rack in one hall, which serves only demand of its shape there. Buildings, power and common parts are committed on the slow clock and configured machines on the fast one. An inset defines an option as a deposit that holds the right to buy later.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
