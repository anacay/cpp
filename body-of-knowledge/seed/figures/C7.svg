<text x="170" y="391" font-size="15" fill="#1F2933">a small payment now for the right, not the duty, to buy later, like a deposit that holds a restaurant table</text>
<text x="80" y="428" font-size="15" fill="#3E4C59" font-weight="600">examples</text>
<text x="170" y="428" font-size="15" fill="#3E4C59"><tspan x="170" dy="0">land options; utility capacity reservations with release terms; deposits on long-lead</tspan><tspan x="170" dy="19.5">electrical gear; staged sites</tspan></text>
<text x="24" y="508" font-size="15" fill="#3E4C59">A shell stays fungible only if its spec is written against the high scenario.</text>
