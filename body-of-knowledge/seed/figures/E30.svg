<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">How long the commitments run</title><desc id="d">Two panels. (a) Commitment lengths in years: a 20-year power purchase agreement [113]; data center leases of 15 to 20 years [72]; a campus lease with a four-year initial term, options to extend, and a residual value guarantee for the first 16 years [75]; a utility tariff with a ramp of up to four years plus an eight-year initial term, drawn apart [114]; and customer contracts averaging about five years [68]. A note quotes that chip lifetimes and contract lifetimes are very similar [72], and a callout quotes Oracle that its leases typically do not align with customer contracts [69]. (b) AEP Ohio's load ramp: the contract capacity in effect is no less than 50, 65, 80 and 90% of the full contract capacity in years one to four, then full. A separate dashed line marks the minimum bill, a separate provision,, which cannot exceed 85% of contract capacity. A dotted line marks that after the fifth post-ramp year, a customer may leave by paying 36 months of minimum charges [114].</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
