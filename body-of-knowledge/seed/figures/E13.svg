<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">From intake to supply's answer</title><desc id="d">Swimlane flowchart in four lanes: declaring team, forum, planning and supply. Planning pre-fills the intake from telemetry with last year's ask and actual. The team confirms its driver forecast and signs any override. The forum approves the ask in a common unit, ranks it and draws the cut line, and the approval is uncommitted until supply answers. Planning nets it against what's on hand, on order, due back and retiring, each dated and owned. Before each layer's commit point, planning sends the net requirement by shape, site and need date, the stage and open range, the signed band, accepted substitutes, the ramp and the rank under shortage. Supply answers either with a dated commit (quantity, date, confidence and any substituted shape), which makes it firm, or with a named gap (how much, by when, why, and a proposed bridge with its owner), which also makes it capped issue, with the gap named and the bridge owned. Both go on the fulfillment ledger, and pegging links each order to its declaration. Supply is scored on promised against actual, and demand on changes inside supply's lead time.</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
