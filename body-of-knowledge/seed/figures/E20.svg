<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">The mid-size version</title><desc id="d">Translation map. Long-lead supply becomes multi-year cloud commitments, reserved capacity, colocation and license renewals, on the vendor's quarter-end calendar. The fulfillment gap becomes commitments that don't match the shapes and regions used, and licenses bought but not deployed. The coefficient becomes cost per customer, transaction or pipeline run. The unallocated line becomes untagged cloud spend plus licenses and AI model usage on separate invoices. The forum becomes a CTO–CFO meeting that owns the cut line. Chargeback may stop at showback. Below, the sales pipeline, with win rates by stage, feeds late-stage deals into the capacity plan, and they are scored against actual usage. A strip lists what not to do: chargeback before showback, a tool before drivers and owners, booking unit-cost gains as savings without checking volume, and forecasting a three-year commitment as elastic spend.</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<text x="24" y="44" font-size="17" fill="#1F2933" font-weight="600">The paper’s term</text>
<text x="354" y="44" font-size="17" fill="#1F2933" font-weight="600">At mid-size (§12)</text>
