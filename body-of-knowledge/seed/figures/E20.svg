<text x="324" y="275" font-size="15" fill="#3E4C59">→</text>
<text x="354" y="275" font-size="15" fill="#1F2933"><tspan x="354" dy="0">the share of the cloud bill no tag explains, plus licenses and AI model usage on</tspan><tspan x="354" dy="19.5">separate invoices or company cards</tspan></text>
