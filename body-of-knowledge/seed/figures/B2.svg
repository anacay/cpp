<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Trucks already on the highway</title><desc id="d">Illustration of three trucks on a highway heading to a building marked launch, each carrying one supply layer. The door is their need date, the start of the next layer, not launch day; at the door, turn-up is a crew working at a rate, not a truck. Below, a ladder of lead times: land, shell and power in years; long-haul network in months to years; machines and parts in quarters; turn-up in weeks per job; placement from minutes to days. Turn-up and order-to-dock times have no published values.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
