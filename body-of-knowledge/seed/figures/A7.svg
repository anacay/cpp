<rect x="416.16" y="160" width="519.84" height="40" fill="url(#k-hatch-blue)" stroke="#0B63C4" stroke-width="1.5" data-cat="goodput" data-cue="pattern"/>
<text x="676.08" y="186" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">≈57</text>
