<text x="69.6" y="186" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10</text>
<rect x="115.2" y="160" width="82.08" height="40" fill="url(#k-hatch-stranded)" stroke="#616E7C" stroke-width="1.5" data-cat="lost" data-cue="pattern"/>
<text x="156.24" y="186" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">9</text>
<rect x="197.28" y="160" width="218.88" height="40" fill="url(#k-dots-gray)" stroke="#616E7C" stroke-width="1.5" data-cat="below-efficiency" data-cue="pattern"/>
