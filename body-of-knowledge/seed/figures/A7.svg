<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-labelledby="t d" data-canvas="band" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Where 100 accelerator-hours go</title><desc id="d">Stacked bar of 100 accelerator-hours: 10 idle (unused line, service), 9 lost to failures and preemptions (owned by cause), about 24 below the program's achievable efficiency (workload), about 57 goodput. 0.9 × 0.9 × 0.7 ≈ 0.57, the ML Productivity Goodput split [105]; goodput is the blue slice. Illustrative.</desc><defs><pattern id="k-hatch-stranded" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#E4E7EB"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8A96A3" stroke-width="1.2"/></pattern><pattern id="k-dots-gray" patternUnits="userSpaceOnUse" width="5" height="5"><rect width="5" height="5" fill="#F5F7FA"/><circle cx="2.5" cy="2.5" r="1.25" fill="#616E7C"/></pattern><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern></defs><rect x="0" y="0" width="960" height="340" fill="#FFFFFF"/>
<text x="24" y="46" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">ML Productivity Goodput [105]: scheduling 0.9 × runtime 0.9 × program 0.7 ≈ 0.57</text>
<path d="M115.2,92 V84 H936 V92 M525.6,84 V79" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="525.6" y="71" font-size="15" fill="#3E4C59" text-anchor="middle" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">scheduled: 90 h (scheduling 0.9)</text>
<path d="M197.28,122 V114 H936 V122 M566.64,114 V109" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="566.64" y="101" font-size="15" fill="#3E4C59" text-anchor="middle" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">kept at checkpoints: 81 h (runtime 0.9)</text>
<path d="M416.16,152 V144 H936 V152 M676.08,144 V139" fill="none" stroke="#0B63C4" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
