<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-labelledby="t d" data-canvas="band" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The ledger line, as planned and as landed</title><desc id="d">Ledger strip from approved to adopted. As planned: gross 6 machines, 7.2 NMU, net 5 new. After the push-out at −3: 5 machines, 5.8 NMU, net 4 once the reclaimed machine is counted. Committed to match, plus the reclaim due at −4, owned by X, and a pool replenishment of 3 owed by +3. The launch landed at 40,000, six weeks late, outside the configured band of 54,000 to 66,000 and ±2 weeks on both size and date, and is recorded against A's declaration. Illustrative.</desc><rect x="0" y="0" width="960" height="340" fill="#FFFFFF"/>
