<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The case on one card</title><desc id="d">Case card. Service X is a shared document store and Product A its largest caller. A's peak rises from 400,000 to 500,000 requests per second: 40,000 organic and 60,000 from a launch at the start of the second quarter. The coefficient is 0.4 calls at 2.5 ms, 1.0 ms per request, so 1,000 requests per second keeps one core busy. Installed cores are twice busy cores (1.5 for failure domains times 4/3 for queueing headroom). A standard machine has 50 cores and 200 GB (1 NMU); a high-memory machine, 50 cores and 600 GB (1.4 NMU). Memory is 100 GB per TB stored. At a launch volume of L thousand, installed cores are 2 × (40 + L) and memory is 0.4 + 0.02 × L TB. The launch is an intent of 40,000–100,000 at the annual cycle, dated at −6 with a base of 60,000 and a high of 90,000, and configured at −3 with two regions and its stored data. The rate is $0.12 per busy core-hour. Illustrative.</desc><defs><pattern id="k-hatch-stranded" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#E4E7EB"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8A96A3" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<rect x="24" y="24" width="912" height="372" rx="8" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="1.25"/>
<text x="42" y="58" font-size="19" fill="#1F2933" font-weight="600">Service X:</text>
<text x="142.09" y="58" font-size="17" fill="#3E4C59">a shared document store.</text>
<text x="369.96" y="58" font-size="19" fill="#1F2933" font-weight="600">Product A:</text>
<text x="473.28" y="58" font-size="17" fill="#3E4C59">its largest caller.</text>
<line x1="25" y1="74" x2="935" y2="74" stroke="#E4E7EB" stroke-width="1" stroke-linecap="round"/>
<text x="42" y="104" font-size="15" fill="#3E4C59">A’s peak</text>
<text x="196" y="104" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">400,000 → 500,000 requests/s: 40,000 organic, 60,000 from a launch at the start of Q2</text>
<text x="42" y="140" font-size="15" fill="#3E4C59">coefficient</text>
<text x="196" y="140" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">α = 0.4 calls × 2.5 ms = 1.0 ms per request: 1,000 requests/s keeps one core busy</text>
<text x="42" y="176" font-size="15" fill="#3E4C59">installed</text>
<text x="196" y="176" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">installed cores = 2 × busy (failure domains 1.5 × queueing headroom 4/3)</text>
<text x="42" y="221" font-size="15" fill="#3E4C59">machines</text>
<rect x="198" y="202.5" width="40" height="12" rx="1.5" fill="#3E4C59" stroke="#1F2933" stroke-width="1.25" data-cat="cores-used" data-cue="shape"/>
<rect x="198" y="217.5" width="12" height="12" rx="1" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<text x="252" y="222" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">standard: 50 cores, 200 GB = 1 NMU</text>
<rect x="198" y="238.5" width="40" height="12" rx="1.5" fill="#3E4C59" stroke="#1F2933" stroke-width="1.25" data-cat="cores-used" data-cue="shape"/>
<rect x="198" y="253.5" width="12" height="12" rx="1" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<rect x="212" y="253.5" width="12" height="12" rx="1" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<rect x="226" y="253.5" width="12" height="12" rx="1" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<text x="252" y="258" font-size="17" fill="#1F2933">high-memory: 50 cores, 600 GB = 1.4 NMU</text>
<rect x="184" y="275" width="4" height="26" fill="#0B63C4" stroke="none"/>
<text x="42" y="294" font-size="15" fill="#3E4C59">memory</text>
<text x="196" y="294" font-size="17" fill="#0B63C4" font-weight="600" style="font-feature-settings:'tnum' 1">100 GB of memory per TB of data stored</text>
<text x="42" y="330" font-size="15" fill="#3E4C59">sizing</text>
<text x="196" y="330" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">a launch of L thousand/s: installed cores = 2 × (40 + L); memory = 0.4 + 0.02 × L TB</text>
<text x="42" y="366" font-size="15" fill="#3E4C59">price</text>
<text x="196" y="366" font-size="17" fill="#1F2933">$0.12 per busy core-hour</text>
<text x="42" y="439" font-size="15" fill="#3E4C59">the launch</text>
<rect x="196" y="419" width="224.05" height="30" rx="15" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(204,424) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9" stroke-dasharray="3 2.6"/>
</g>
<text x="230" y="439.25" font-size="15" fill="#1F2933">Intent at the annual cycle</text>
<text x="204" y="472" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">40,000–100,000</text>
<path d="M430.05,434 L447.6,434" fill="none" stroke="#8A96A3" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M454,434 L446,438 L446,430 Z" fill="#8A96A3" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="464" y="419" width="129.48" height="30" rx="15" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(472,424) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,12 L12,3 A9,9 0 0 1 21.00,12.00 Z" fill="#3E4C59" stroke="none"/>
<circle cx="12" cy="12" r="9"/>
</g>
<text x="498" y="439.25" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1">Dated at −6</text>
<text x="472" y="472" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">base 60,000, high 90,000</text>
<path d="M603.48,434 L699.6,434" fill="none" stroke="#8A96A3" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M706,434 L698,438 L698,430 Z" fill="#8A96A3" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="716" y="419" width="167" height="30" rx="15" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.25"/>
<g transform="translate(724,424) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,12 L12,3 A9,9 0 0 1 12.00,21.00 Z" fill="#3E4C59" stroke="none"/>
<circle cx="12" cy="12" r="9"/>
</g>
<text x="750" y="439.25" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1">Configured at −3</text>
<text x="724" y="472" font-size="17" fill="#1F2933">two regions, data stored</text>
<text x="24" y="508" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">months from launch: −6 is six months before it</text>
<text x="936" y="508" font-size="15" fill="#3E4C59" text-anchor="end">Illustrative numbers</text>
</svg>
