<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Eight games, and where they strike</title><desc id="d">A strip of six points in the planning cycle (intake, declaration stages, cut line, grant, inside the lead time, buffers), with eight games above and their counters below. Capacity requests are budgets, pathologies included [95, 96]. At intake, relabeling, organic growth declared as a launch to jump the queue: launch priority requires a dated declaration with a named owner. At the stages, parked intents enter at their stage's record and expire if they don't advance, and stage inflation is met by promotion only on the stage's evidence, with size and slip scored by stage. At the cut line, a late ask is charged its bridge premium and late asks are reported by owner. At the grant, capacity held for a launch that quietly moved expires unless re-confirmed. Inside the lead time, churn is bounded by change bands, with changes reported by requester. At buffers, reliability as a trump card is met with named buffers, each sized by its owner, and planning's own padding, which matters most, becomes a signed forecast-error buffer line.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="37" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">Above: the game, and what it looks like [95, 96]. Below: its counter, at the same point in the cycle.</text>
<rect x="24" y="54" width="107" height="151" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
