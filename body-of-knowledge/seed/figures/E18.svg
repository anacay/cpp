<text x="262" y="115" font-size="15" fill="#3E4C59"><tspan x="262" dy="0">presented</tspan><tspan x="262" dy="19.5">as</tspan><tspan x="262" dy="19.5">configured</tspan><tspan x="262" dy="19.5">to win a</tspan><tspan x="262" dy="19.5">grant</tspan></text>
