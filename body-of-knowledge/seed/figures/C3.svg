<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">What the linear formula hides</title><desc id="d">(a) Two consumers each peak at 100 cores, one at 2 p.m., the service's peak, one at 3 a.m.; the night consumer sends 20 at 2 p.m., so it caused 20. (b) Surviving one loss of three domains takes 1.5 times peak; one of four, 1.33; two of four, 2. The number of losses to survive is set by the consumer's availability tier. Illustrative.</desc><defs><pattern id="k-hatch-light" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD2D9" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
