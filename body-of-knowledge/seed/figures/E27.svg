<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-labelledby="t d" data-canvas="band" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Key to the record’s marks</title><desc id="d">Key. A single reported value, or a source's example value, is a filled dot; an average is a dot with a bar over it; a median is a half-filled ring; a recommended value is a ring with a centre dot. A reported range is a capped bar; "more than" is the stated value's mark with an open arrow to the right; "up to" is a cap at the stated maximum with a short, fading arrow to the left, never a bar from the axis; a chevron at the axis edge marks a value off the scale. A value described in words is a text chip; a dashed empty row means no public value was found; a bracketed number is the source, listed in B.6. Filling squares show firmness, from less firm to more firm, in the order one source reports it.</desc><rect x="0" y="0" width="960" height="340" fill="#FFFFFF"/>
