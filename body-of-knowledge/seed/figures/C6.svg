<text x="376" y="165.5" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600">50%</text>
<text x="24" y="207" font-size="15" fill="#3E4C59">four launches, each half likely</text>
<text x="24" y="250" font-size="17" fill="#1F2933" font-weight="600">usually about two land</text>
<text x="24" y="276" font-size="17" fill="#1F2933" style="font-feature-settings:'tnum' 1">all four: about 1 in 16 (≈ 6%)</text>
<line x1="480" y1="28" x2="480" y2="290" stroke="#E4E7EB" stroke-width="1.25" stroke-linecap="butt"/>
