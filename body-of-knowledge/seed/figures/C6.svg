<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-labelledby="t d" data-canvas="band" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Four launches, one driver</title><desc id="d">Left: four independent launches, each half likely (a coin marked 50%); usually about two land, and all four only about one time in sixteen. Right: the same four tied to one driver land or slip together; half the time all four land, and a plan for two is short by two. Planning for only some launches, and checking that they aren't correlated: Hixson and Guliani [6]. Illustrative.</desc><rect x="0" y="0" width="960" height="340" fill="#FFFFFF"/>
