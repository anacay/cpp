<text x="177.6" y="225" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">$683,280</text>
<text x="268" y="225" font-size="15" fill="#3E4C59">actual</text>
<line x1="316" y1="34" x2="316" y2="292" stroke="#E4E7EB" stroke-width="1.25" stroke-linecap="butt"/>
<text x="338" y="54" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">The +$157,680 overrun, by who moved it</text>
<g transform="translate(376,85) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="9" r="3.2"/><path d="M6.3,19 C7,14.6 17,14.6 17.7,19"/>
</g>
