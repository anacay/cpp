<text x="439.85" y="272" font-size="15" fill="#3E4C59">from the two blue terms the</text>
<text x="338" y="291" font-size="15" fill="#3E4C59">team didn't own: more than the whole overrun</text>
<line x1="700" y1="34" x2="700" y2="292" stroke="#E4E7EB" stroke-width="1.25" stroke-linecap="butt"/>
<text x="718" y="54" font-size="17" fill="#1F2933" font-weight="600">It missed a second way</text>
<text x="718" y="88" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">Approved: 4 units (CPU only)</text>
<rect x="718" y="96" width="136" height="16" fill="#CBD2D9" stroke="#616E7C" stroke-width="1.25" data-cat="plan" data-cue="label"/>
<text x="718" y="140" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">Needed: 4.8, memory counted</text>
<rect x="718" y="148" width="136" height="16" fill="#CBD2D9" stroke="#616E7C" stroke-width="1.25" data-cat="plan" data-cue="label"/>
<rect x="854" y="148" width="27.2" height="16" fill="url(#k-hatch-blue)" stroke="#0B63C4" stroke-width="1.25" data-cat="unfavorable" data-cue="pattern"/>
<text x="889.2" y="161" font-size="17" fill="#0B63C4" font-weight="600" style="font-feature-settings:'tnum' 1">+0.8</text>
