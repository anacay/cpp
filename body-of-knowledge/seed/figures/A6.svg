<rect x="732" y="217.5" width="12" height="12" rx="1" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<rect x="746" y="217.5" width="12" height="12" rx="1" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
