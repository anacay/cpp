<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-labelledby="t d" data-canvas="band" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Close forecast, wide miss</title><desc id="d">Summary card. Forecast 500,000 vs actual 480,000 requests per second, within 4%; bill $525,600 planned vs $683,280 actual, 30% over. The overrun splits into volume −$21,024 (product team), coefficient +$126,144 (shared service) and rate +$52,560 (service owner, with finance); the last two exceed the whole overrun. Second miss: approved as 4 units, needed 4.8, machines a quarter late. Invented numbers.</desc><defs><pattern id="k-dots-gray" patternUnits="userSpaceOnUse" width="5" height="5"><rect width="5" height="5" fill="#F5F7FA"/><circle cx="2.5" cy="2.5" r="1.25" fill="#616E7C"/></pattern><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern><pattern id="k-hatch-stranded" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#E4E7EB"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8A96A3" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="340" fill="#FFFFFF"/>
<text x="24" y="68" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">Forecast: within 4%</text>
<rect x="24" y="84" width="112" height="16" fill="#CBD2D9" stroke="#616E7C" stroke-width="1.25" data-cat="plan" data-cue="label"/>
<text x="144" y="97" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">500k</text>
<text x="193.64" y="97" font-size="15" fill="#3E4C59">plan</text>
<rect x="24" y="110" width="107.52" height="16" fill="#3E4C59" stroke="#1F2933" stroke-width="1" data-cat="actual" data-cue="label"/>
<text x="139.52" y="123" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">480k req/s</text>
<text x="236.62" y="123" font-size="15" fill="#3E4C59">actual</text>
<text x="24" y="170" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">Bill: 30% over plan</text>
<rect x="24" y="186" width="112" height="16" fill="#CBD2D9" stroke="#616E7C" stroke-width="1.25" data-cat="plan" data-cue="label"/>
