<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">The paper on one page: two claims, one method, two supports</title><desc id="d">Concept map. At the top, the problem: a forecast within 4% and a bill 30% over, and an approval with no usable machines. Two pillars follow. A coefficient is an agreement: owned, versioned, restated, with launches entering as declarations that firm up in stages (Section 5). Approval is not allocation: the gap in shape, place and time needs an owner and a ledger, and supply runs on its own clock under contracts and slips in steps (Section 6). Both feed the commit-point method (Section 8), which writes into mechanisms 12 and 13 of the thirteen-mechanism operating discipline (Section 9). Three prices answer three questions (Section 4). A strip lists the newcomer path: Sections 1, 2, 4, 5.2, 5.4, 6.5, 7, 8 and 14. A footer says it is a practitioner synthesis and the method is untested (Section 13).</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<rect x="170" y="24" width="620" height="60" rx="6" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.5"/>
<text x="480" y="47" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">The problem (§1; §7’s invented numbers)</text>
<text x="480" y="71" font-size="15" fill="#3E4C59" text-anchor="middle" style="font-feature-settings:'tnum' 1">forecast within 4%, bill 30% over; approved, still no usable machines</text>
<rect x="24" y="108" width="438" height="184" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="38" y="134" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">Claim 1. A coefficient is an agreement (§5)</text>
<g transform="translate(39,151) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<polygon points="21.53,17.50 12.00,23.00 2.47,17.50 2.47,6.50 12.00,1.00 21.53,6.50"/><path d="M8,8.5 H16 M8,12 H16 M8,15.5 H16" stroke-width="2.40"/>
</g>
<text x="70" y="167" font-size="15" fill="#3E4C59">shared service</text>
<text x="70" y="187" font-size="15" fill="#1F2933"><tspan x="70" dy="0">owned, versioned, restated when hardware or the</tspan><tspan x="70" dy="19.5">meter changes</tspan></text>
<g transform="translate(39,221) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="9" r="3.2"/><path d="M6.3,19 C7,14.6 17,14.6 17.7,19"/>
</g>
<text x="70" y="237" font-size="15" fill="#3E4C59">product team</text>
<text x="70" y="257" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1"><tspan x="70" dy="0">launches enter as declarations that firm up in stages</tspan><tspan x="70" dy="19.5">(§5.4)</tspan></text>
<rect x="498" y="108" width="438" height="184" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="512" y="134" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">Claim 2. Approval is not allocation (§6)</text>
<g transform="translate(513,151) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<path d="M4,6 H17.5 L22.5,12 L17.5,18 H4 Q2,18 2,16 V8 Q2,6 4,6 Z"/><circle cx="18" cy="12" r="1.3"/>
<path d="M5,18 V13.5 M8,18 V15 M11,18 V13.5 M14,18 V15"/>
</g>
<text x="544" y="167" font-size="15" fill="#3E4C59">planning</text>
<text x="544" y="187" font-size="15" fill="#1F2933"><tspan x="544" dy="0">in shape, place and time; the gap needs an owner</tspan><tspan x="544" dy="19.5">and a ledger</tspan></text>
<g transform="translate(513,221) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<rect x="3.5" y="9" width="17" height="12.5"/><rect x="2" y="5" width="20" height="4"/><path d="M9.5,9 V21.5 M14.5,9 V21.5"/>
</g>
<text x="544" y="237" font-size="15" fill="#3E4C59">supply chain</text>
<text x="544" y="257" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1"><tspan x="544" dy="0">supply runs on its own clock, under contracts, and</tspan><tspan x="544" dy="19.5">slips in steps (§6.2, §6.7)</tspan></text>
<rect x="104" y="318" width="752" height="80" rx="6" fill="#FFFFFF" stroke="#0B63C4" stroke-width="2"/>
<text x="120" y="346" font-size="17" fill="#1F2933" font-weight="600">The commit-point method (§8)</text>
<text x="120" y="372" font-size="15" fill="#3E4C59"><tspan x="120" dy="0">for each layer: when must it be ordered, how firm is the launch by then,</tspan><tspan x="120" dy="19.5">what to commit, who owns the rest</tspan></text>
<line x1="668" y1="368" x2="784" y2="368" stroke="#CBD2D9" stroke-width="6" stroke-linecap="butt"/>
<g transform="translate(656,356) scale(1)" fill="none" stroke="#1F2933" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
