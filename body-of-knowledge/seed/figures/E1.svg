</g>
<text x="682" y="388" font-size="15" fill="#3E4C59">commit point</text>
<g transform="translate(657,329) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<path d="M12,12 L12,3 A9,9 0 0 1 21.00,12.00 Z" fill="#3E4C59" stroke="none"/>
<circle cx="12" cy="12" r="9"/>
</g>
<text x="687" y="345.25" font-size="15" fill="#1F2933">how firm the launch is</text>
<rect x="130" y="428" width="400" height="48" rx="6" fill="#F5F7FA" stroke="#3E4C59" stroke-width="1.5"/>
<text x="330" y="459" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">Operating discipline: thirteen mechanisms (§9)</text>
<rect x="570" y="428" width="286" height="48" rx="6" fill="#F5F7FA" stroke="#3E4C59" stroke-width="1.5"/>
<text x="713" y="459" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">Three prices, three questions (§4)</text>
<text x="24" y="459" font-size="15" fill="#3E4C59">Two supports</text>
<line x1="24" y1="496" x2="936" y2="496" stroke="#E4E7EB" stroke-width="1" stroke-linecap="butt"/>
<text x="24" y="508" font-size="15" fill="#3E4C59">New to planning: 1, 2, 4, 5.2, 5.4, 6.5, 7, 8, 14</text>
<text x="936" y="508" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1">A practitioner synthesis; the method is untested (§13)</text>
