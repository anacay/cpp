<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Gates between events; bands that narrow</title><desc id="d">(a) A decision event, then a gate, then a commit point. When the commit point comes first, there are three choices: ask earlier, buy an option past the event, or commit to the stage's record and name the owner of the residual. (b) Change bands narrow from ±50% to ±25% to ±10% around 60,000; the launch landed at 40,000, six weeks late, outside both bands. Panel (a) uses generic timing, panel (b) Appendix A's. The bands follow manufacturing time fences and quantity-flexibility contracts [70, 71]. Illustrative.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
