<text x="40" y="420" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="40" dy="0">1. The layers work together: machines can still be bought</tspan><tspan x="40" dy="19.5">once demand firms.</tspan></text>
