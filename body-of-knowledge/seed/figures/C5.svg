<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">The slower the layer, the higher up the range</title><desc id="d">Three range bars. Turn-up, ratio 1 to 1, covered to the median. Machines, 4 to 1, to the 80th percentile. Power and shell, 19 to 1, to the 95th, mostly as options. Notes give the two conditions: layers must work together, and the high is held mostly as options. Illustrative; the paper's argument, not a published result.</desc><defs><pattern id="k-hatch-light" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD2D9" stroke-width="1.2"/></pattern><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern><pattern id="k-dots-gray" patternUnits="userSpaceOnUse" width="5" height="5"><rect width="5" height="5" fill="#F5F7FA"/><circle cx="2.5" cy="2.5" r="1.25" fill="#616E7C"/></pattern><pattern id="k-hatch-stranded" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#E4E7EB"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8A96A3" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<rect x="24" y="24" width="912" height="34" rx="4" fill="#F5F7FA" stroke="#1F2933" stroke-width="1.5"/>
<text x="36" y="46" font-size="15" fill="#1F2933" font-weight="600">This paper's argument, not a published result.</text>
<text x="377.81" y="46" font-size="15" fill="#3E4C59">Persistent demand, growing portfolio. Illustrative ratios.</text>
<text x="24" y="100" font-size="15" fill="#3E4C59">layer, slow → fast</text>
