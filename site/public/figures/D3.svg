<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The walk, and what it writes down</title><desc id="d">Eight steps in two groups. Read (worksheet Part A): list the layers and their lead times in the slow case; find each layer's need date and commit point; read the stage and the range still open at each commit point, and whether the driving attribute is known. Decide (worksheet Part B and footer): choose how far up the range to cover; net against what you have; split each layer into firm, flexible and named; agree change bands per stage; write it down and get supply's answer. The steps flow into four artifacts: the declaration register entry with its bands (mechanism 12), a commit-point map line per layer (13), the supply request and supply's answer (11), and the fulfillment ledger line (5), whose net and committed columns come from steps 5 and 6. A decision note is added where a commit point fell before the event that resolves it. Method steps are numbered pills, unlike the funnel's numbered squares.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="44" font-size="19" fill="#1F2933" font-weight="600">Read</text>
<text x="80.38" y="44" font-size="15" fill="#3E4C59">worksheet Part A</text>
<rect x="24" y="60" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="80" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">1</text>
<text x="72" y="80" font-size="17" fill="#1F2933" font-weight="600">List the layers and their lead times, using the slow case</text>
<text x="72" y="100" font-size="15" fill="#3E4C59">every layer it touches: a usual and a cautious lead time</text>
<rect x="24" y="110" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="130" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">2</text>
<text x="72" y="130" font-size="17" fill="#1F2933" font-weight="600">Find each layer's need date and commit point</text>
<text x="72" y="150" font-size="15" fill="#3E4C59">commit point = need date (next layer's start) − cautious lead time</text>
<rect x="24" y="160" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="180" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">3</text>
<text x="72" y="180" font-size="17" fill="#1F2933" font-weight="600">Read the stage at each commit point, and the range still open</text>
<text x="72" y="200" font-size="15" fill="#3E4C59">is the driving attribute known by then? If not, choose and write it down</text>
<line x1="24" y1="216" x2="566" y2="216" stroke="#CBD2D9" stroke-width="1" stroke-linecap="butt"/>
<text x="24" y="240" font-size="19" fill="#1F2933" font-weight="600">Decide</text>
<text x="98.09" y="240" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">worksheet Part B, and its footer (step 7)</text>
<rect x="24" y="256" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="276" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">4</text>
<text x="72" y="276" font-size="17" fill="#1F2933" font-weight="600">Choose how far up the range to cover</text>
<text x="72" y="296" font-size="15" fill="#3E4C59">by the layer's shortage-to-idle ratio, in the layer's own units</text>
<rect x="24" y="306" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="326" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">5</text>
<text x="72" y="326" font-size="17" fill="#1F2933" font-weight="600">Net against what you already have</text>
<text x="72" y="346" font-size="15" fill="#3E4C59">target − on hand − on order − due back + retiring; each dated, owned</text>
<rect x="24" y="356" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="376" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">6</text>
<text x="72" y="376" font-size="17" fill="#1F2933" font-weight="600">Split each layer into firm, flexible and named</text>
<text x="72" y="396" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">firm to the base; flexible to the step 4 target; named above it</text>
<rect x="24" y="406" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="426" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">7</text>
<text x="72" y="426" font-size="17" fill="#1F2933" font-weight="600">Agree change bands per stage</text>
<text x="72" y="446" font-size="15" fill="#3E4C59">how far size and date may move before a priced event; supply signs</text>
<rect x="24" y="456" width="42" height="28" rx="14" fill="#1F2933" stroke="none"/>
<text x="45" y="476" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">8</text>
<text x="72" y="476" font-size="17" fill="#1F2933" font-weight="600">Write it down, and get supply's answer</text>
<text x="72" y="496" font-size="15" fill="#3E4C59">four artifacts; supply answers with a dated commit or a named gap</text>
<text x="612" y="44" font-size="19" fill="#1F2933" font-weight="600">Writes into</text>
<text x="721.94" y="44" font-size="15" fill="#3E4C59">mechanism no., owner</text>
<rect x="612" y="58" width="324" height="71" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="622" y="81" font-size="15" fill="#3E4C59" font-weight="600" style="font-feature-settings:'tnum' 1">13</text>
<text x="648" y="81" font-size="15" fill="#1F2933" font-weight="600">Commit-point map line, per layer</text>
<g transform="translate(622,92.6) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<rect x="3.5" y="9" width="17" height="12.5"/><rect x="2" y="5" width="20" height="4"/><path d="M9.5,9 V21.5 M14.5,9 V21.5"/>
</g>
<text x="645" y="108.6" font-size="17" fill="#3E4C59">+</text>
<g transform="translate(660,92.6) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M4,6 H17.5 L22.5,12 L17.5,18 H4 Q2,18 2,16 V8 Q2,6 4,6 Z"/><circle cx="18" cy="12" r="1.3"/>
<path d="M5,18 V13.5 M8,18 V15 M11,18 V13.5 M14,18 V15"/>
</g>
<text x="688" y="107.6" font-size="15" fill="#1F2933">supply chain, with planning</text>
<rect x="612" y="139" width="324" height="58.5" rx="6" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="622" y="162" font-size="15" fill="#1F2933" font-weight="600"><tspan x="622" dy="0">Decision note, where a commit point fell</tspan><tspan x="622" dy="19.5">before the event that resolves it</tspan></text>
<rect x="612" y="220.5" width="324" height="90.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="622" y="243.5" font-size="15" fill="#3E4C59" font-weight="600" style="font-feature-settings:'tnum' 1">12</text>
<text x="648" y="243.5" font-size="15" fill="#1F2933" font-weight="600"><tspan x="648" dy="0">Declaration register entry, with its</tspan><tspan x="648" dy="19.5">bands</tspan></text>
<g transform="translate(622,274.6) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="10.5"/><circle cx="12" cy="9" r="3.2"/><path d="M6.3,19 C7,14.6 17,14.6 17.7,19"/>
</g>
<text x="645" y="290.6" font-size="17" fill="#3E4C59">+</text>
<g transform="translate(660,274.6) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M4,6 H17.5 L22.5,12 L17.5,18 H4 Q2,18 2,16 V8 Q2,6 4,6 Z"/><circle cx="18" cy="12" r="1.3"/>
<path d="M5,18 V13.5 M8,18 V15 M11,18 V13.5 M14,18 V15"/>
</g>
<text x="688" y="289.6" font-size="15" fill="#1F2933">declaring team; planning keeps it</text>
<rect x="612" y="321" width="324" height="90.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="622" y="344" font-size="15" fill="#3E4C59" font-weight="600" style="font-feature-settings:'tnum' 1">11</text>
<text x="648" y="344" font-size="15" fill="#1F2933" font-weight="600">Supply request and supply's answer</text>
<g transform="translate(622,365.35) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<rect x="3.5" y="9" width="17" height="12.5"/><rect x="2" y="5" width="20" height="4"/><path d="M9.5,9 V21.5 M14.5,9 V21.5"/>
</g>
<text x="645" y="381.35" font-size="17" fill="#3E4C59">+</text>
<g transform="translate(660,365.35) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M4,6 H17.5 L22.5,12 L17.5,18 H4 Q2,18 2,16 V8 Q2,6 4,6 Z"/><circle cx="18" cy="12" r="1.3"/>
<path d="M5,18 V13.5 M8,18 V15 M11,18 V13.5 M14,18 V15"/>
</g>
<text x="683" y="381.35" font-size="17" fill="#3E4C59">+</text>
<g transform="translate(698,365.35) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<rect x="2.5" y="2.5" width="19" height="19" rx="1"/>
<path d="M15,8.6 C14.2,6.9 9,6.6 9,9.5 C9,12.3 15,11.4 15,14.5 C15,17.5 9.6,17.3 8.8,15.4 M12,5 V19"/>
</g>
<text x="726" y="370.6" font-size="15" fill="#1F2933"><tspan x="726" dy="0">supply chain, with planning</tspan><tspan x="726" dy="19.5">and finance</tspan></text>
<rect x="612" y="421.5" width="324" height="90.5" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="622" y="444.5" font-size="15" fill="#3E4C59" font-weight="600" style="font-feature-settings:'tnum' 1">5</text>
<text x="648" y="444.5" font-size="15" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1"><tspan x="648" dy="0">Fulfillment ledger line: net (step 5),</tspan><tspan x="648" dy="19.5">committed (step 6)</tspan></text>
<g transform="translate(622,475.6) scale(0.83)" fill="none" stroke="#1F2933" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M4,6 H17.5 L22.5,12 L17.5,18 H4 Q2,18 2,16 V8 Q2,6 4,6 Z"/><circle cx="18" cy="12" r="1.3"/>
<path d="M5,18 V13.5 M8,18 V15 M11,18 V13.5 M14,18 V15"/>
</g>
<text x="650" y="490.6" font-size="15" fill="#1F2933">planning carries the gap</text>
