<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Working back from launch</title><desc id="d">Subtraction tree working back from launch. One month of load tests sets ready for service at −1. One month of turn-up puts machines on the dock at −2. From −2: high-memory machines, nine months cautious (six usual), commit at −11, while the launch is an intent. Standard machines from the pool, one month cautious, commit at −3, at Configured. Power and positions, eighteen months cautious, commit at −20, before any declaration exists. A note says that without the method, the high-memory commit point was −6, the usual lead time counted back from launch; the order went in at −3 and the machines arrived at +3. Illustrative.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="40" font-size="17" fill="#1F2933" font-weight="600">commit point = need date − cautious lead time</text>
<text x="24" y="64" font-size="15" fill="#3E4C59">months from launch; usual lead time in brackets</text>
<rect x="24" y="84" width="396" height="64" rx="4" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1"/>
<rect x="24" y="84" width="3" height="64" fill="#8A96A3" stroke="none"/>
<text x="40" y="111.5" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="40" dy="0">Without the method: commit point −6 (usual lead</tspan><tspan x="40" dy="19.5">time from launch); ordered at −3, arrived +3</tspan></text>
<rect x="716" y="40" width="220" height="44" rx="22" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.75"/>
<text x="826" y="67.25" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">launch: month 0</text>
<rect x="716" y="140" width="220" height="44" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="826" y="167.25" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1">ready for service: −1</text>
<rect x="716" y="224" width="220" height="64" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="826" y="251.5" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1"><tspan x="826" dy="0">machines on the dock: −2</tspan><tspan x="826" dy="19.5">(need date)</tspan></text>
<text x="24" y="190" font-size="15" fill="#3E4C59"><tspan x="24" dy="0">stage at the</tspan><tspan x="24" dy="19.5">commit point</tspan></text>
