<text x="368" y="251.5" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600"><tspan x="368" dy="0">High-memory machines: −2 − 9 months cautious</tspan><tspan x="368" dy="19.5">(usual 6) = −11</tspan></text>
<rect x="24" y="241" width="86.32" height="30" rx="15" fill="#FFFFFF" stroke="#8A96A3" stroke-width="1.25"/>
