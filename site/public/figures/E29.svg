<text x="372" y="394" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="372" dy="0">two durations, not one timeline: the two parts are not added; ‘limited publicly</tspan><tspan x="372" dy="19.5">available information on large load interconnection timelines’ [65]</tspan></text>
