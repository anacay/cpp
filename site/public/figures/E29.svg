<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Two queues for power</title><desc id="d">Rows on a months axis, each counted from its own start. New generation's median wait from request to signed agreement was well over three years in 2025 [112]; that measures power plants, not data center loads. For a large new load, one transmission owner cited by Lawrence Berkeley National Laboratory expects studies to take 6 to 18 months, and construction needing a line extension at least 18 and up to 60 months. The two are durations, each on its own row with a faint baseline from zero, so they do not read as one timeline, and they are not added [65]. The average wait for a grid connection in primary data center markets is more than four years, a different measure [60]. A chip notes natural gas as temporary bridge power and increasingly permanent on-site generation [60].</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<text x="24" y="39" font-size="15" fill="#3E4C59" font-weight="600">Public reported values; see sources</text>
