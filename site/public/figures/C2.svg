<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Divide by what you can use</title><desc id="d">Two panels for a $9.0 million pool. Rate on usage: 65 million core-hours gives about $0.138; when one consumer leaves and usage falls to 45 million, the rate becomes $0.20, up 44%. Rate on practical capacity of 75 million: $0.12 before and after; the 30 million idle core-hours, $3.6 million, sit on the service's unused line. Illustrative.</desc><defs><pattern id="k-hatch-light" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD2D9" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="46" font-size="19" fill="#1F2933" font-weight="600">(a) Rate on usage</text>
<text x="220" y="46" font-size="15" fill="#3E4C59">$9.0M pool ÷ core-hours used</text>
<text x="24" y="82" font-size="15" fill="#3E4C59">before</text>
<rect x="214" y="64" width="429" height="26" fill="#3E4C59" stroke="#1F2933" stroke-width="1" data-cat="used" data-cue="label"/>
<text x="224" y="82.5" font-size="15" fill="#FFFFFF" font-weight="600" style="font-feature-settings:'tnum' 1">65M used</text>
<text x="735" y="83" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">≈ $0.138</text>
<path d="M36,94 L36,112.4" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M36,118 L32.5,111 L39.5,111 Z" fill="#616E7C" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="50" y="111" font-size="15" fill="#3E4C59">one consumer leaves</text>
<text x="24" y="146" font-size="15" fill="#3E4C59">after</text>
<rect x="214" y="128" width="297" height="26" fill="#3E4C59" stroke="#1F2933" stroke-width="1" data-cat="used" data-cue="label"/>
<text x="224" y="146.5" font-size="15" fill="#FFFFFF" font-weight="600" style="font-feature-settings:'tnum' 1">45M used</text>
<text x="735" y="147" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">$0.20</text>
<text x="797" y="138" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1"><tspan x="797" dy="0">every remaining</tspan><tspan x="797" dy="17.25">bill +44%</tspan></text>
<polyline points="795,172 795,182 20,182 20,94" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M20,92 l-5,9 h10 Z" fill="#616E7C" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="440" y="202" font-size="15" fill="#3E4C59" text-anchor="middle">a reason for the next to leave</text>
<line x1="24" y1="228" x2="936" y2="228" stroke="#E4E7EB" stroke-width="1.25" stroke-linecap="butt"/>
<text x="24" y="262" font-size="19" fill="#1F2933" font-weight="600">(b) Rate on practical capacity</text>
<text x="330" y="262" font-size="15" fill="#3E4C59">$9.0M pool ÷ 75M practical core-hours</text>
<line x1="709" y1="280" x2="709" y2="388" stroke="#1F2933" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="butt"/>
<text x="709" y="276" font-size="15" fill="#1F2933" text-anchor="end" style="font-feature-settings:'tnum' 1">practical 75M</text>
<text x="24" y="308" font-size="15" fill="#3E4C59">before</text>
<rect x="214" y="290" width="429" height="26" fill="#3E4C59" stroke="#1F2933" stroke-width="1" data-cat="used" data-cue="label"/>
<text x="224" y="308.5" font-size="15" fill="#FFFFFF" font-weight="600" style="font-feature-settings:'tnum' 1">65M used</text>
<rect x="643" y="290" width="66" height="26" fill="url(#k-hatch-light)" stroke="#8A96A3" stroke-width="1.25" data-cat="idle" data-cue="pattern"/>
<text x="676" y="308.5" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">10M</text>
<text x="735" y="309" font-size="17" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">$0.12</text>
<path d="M36,320 L36,338.4" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M36,344 L32.5,337 L39.5,337 Z" fill="#616E7C" stroke="none" stroke-linejoin="round" stroke-linecap="round"/>
<text x="50" y="337" font-size="15" fill="#3E4C59">one consumer leaves</text>
<text x="24" y="372" font-size="15" fill="#3E4C59">after</text>
<rect x="214" y="354" width="297" height="26" fill="#3E4C59" stroke="#1F2933" stroke-width="1" data-cat="used" data-cue="label"/>
<text x="224" y="372.5" font-size="15" fill="#FFFFFF" font-weight="600" style="font-feature-settings:'tnum' 1">45M used</text>
<rect x="511" y="354" width="198" height="26" fill="url(#k-hatch-light)" stroke="#8A96A3" stroke-width="1.25" data-cat="idle" data-cue="pattern"/>
<text x="610" y="372.5" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">30M idle</text>
<text x="735" y="373" font-size="17" fill="#0B63C4" font-weight="600" style="font-feature-settings:'tnum' 1">still $0.12</text>
<path d="M511,386 V394 H709 V386 M610,394 V399" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="476.82" y="420" font-size="15" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">30M idle = $3.6M on the unused line</text>
<g transform="translate(476.82,433) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<polygon points="21.53,17.50 12.00,23.00 2.47,17.50 2.47,6.50 12.00,1.00 21.53,6.50"/><path d="M8,8.5 H16 M8,12 H16 M8,15.5 H16" stroke-width="2.40"/>
</g>
<text x="506.82" y="449.25" font-size="15" fill="#1F2933">owned by the shared service</text>
<rect x="24" y="476" width="22" height="14" fill="#3E4C59" stroke="#1F2933" stroke-width="1.25"/>
<text x="54" y="488.25" font-size="15" fill="#3E4C59">core-hours used</text>
<rect x="194.06" y="476" width="22" height="14" fill="url(#k-hatch-light)" stroke="#8A96A3" stroke-width="1.25"/>
<text x="226.06" y="488.25" font-size="15" fill="#3E4C59">idle core-hours</text>
<text x="936" y="508" font-size="15" fill="#3E4C59" text-anchor="end">Illustrative</text>
</svg>
