<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Six buffers, and the two forces on them</title><desc id="d">Three panels. (a) Six named buffers: redundancy, maintenance reserve, queueing headroom, forecast-error buffer, launch reserve and inventory buffer, with one operator's published split of about 94% guaranteed, 2% for random failures and 4% for correlated failures [54]. (b) Independent monthly errors of ±10 grow to about ±20 over four months, not ±40. A growth-rate error, 4% a month against a 3% forecast, ends about 12% above plan after a year and about 26% after two. (c) Pooling: two regions holding 10 each need about 14 together, not 20; four need about 20, not 40. Illustrative except the cited split.</desc><defs><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern></defs><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<text x="24" y="44" font-size="19" fill="#1F2933" font-weight="600">(a) Name each buffer</text>
<rect x="24" y="58" width="142" height="62" rx="4" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="95" y="84.25" font-size="15" fill="#1F2933" text-anchor="middle"><tspan x="95" dy="0">redundancy</tspan><tspan x="95" dy="19.5">(N+k)</tspan></text>
<rect x="178" y="58" width="142" height="62" rx="4" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="249" y="84.25" font-size="15" fill="#1F2933" text-anchor="middle"><tspan x="249" dy="0">maintenance</tspan><tspan x="249" dy="19.5">reserve</tspan></text>
<rect x="332" y="58" width="142" height="62" rx="4" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="403" y="84.25" font-size="15" fill="#1F2933" text-anchor="middle"><tspan x="403" dy="0">queueing</tspan><tspan x="403" dy="19.5">headroom</tspan></text>
<rect x="486" y="58" width="142" height="62" rx="4" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="557" y="84.25" font-size="15" fill="#1F2933" text-anchor="middle"><tspan x="557" dy="0">forecast-error</tspan><tspan x="557" dy="19.5">buffer</tspan></text>
<rect x="640" y="58" width="142" height="62" rx="4" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="711" y="94" font-size="15" fill="#1F2933" text-anchor="middle">launch reserve</text>
<rect x="794" y="58" width="142" height="62" rx="4" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="865" y="74.5" font-size="15" fill="#1F2933" text-anchor="middle"><tspan x="865" dy="0">inventory buffer</tspan><tspan x="865" dy="19.5">(parts and ready</tspan><tspan x="865" dy="19.5">machines)</tspan></text>
<text x="557" y="142" font-size="15" fill="#3E4C59" text-anchor="middle" style="font-feature-settings:'tnum' 1">a signed line (§10.3)</text>
<line x1="557" y1="121" x2="557" y2="128" stroke="#8A96A3" stroke-width="1.25" stroke-linecap="round"/>
<text x="24" y="178" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">One operator’s split of its servers (RAS [54]):</text>
<rect x="24" y="190" width="857.28" height="30" fill="#3E4C59" stroke="#1F2933" stroke-width="1" data-cat="guaranteed" data-cue="label"/>
<rect x="881.28" y="190" width="18.24" height="30" fill="#CBD2D9" stroke="#1F2933" stroke-width="1" data-cat="random" data-cue="label"/>
<rect x="899.52" y="190" width="36.48" height="30" fill="#FFFFFF" stroke="#1F2933" stroke-width="1" data-cat="correlated" data-cue="label"/>
<text x="36" y="210" font-size="15" fill="#FFFFFF" font-weight="600" style="font-feature-settings:'tnum' 1">≈94% guaranteed</text>
<circle cx="890.4" cy="220" r="2.5" fill="#616E7C" stroke="none"/>
<text x="873.28" y="244" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">2% random failures</text>
<polyline points="890.4,220 890.4,238.75 878.28,238.75" fill="none" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="917.76" cy="220" r="2.5" fill="#616E7C" stroke="none"/>
<text x="936" y="266" font-size="15" fill="#3E4C59" text-anchor="end" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">4% correlated failures</text>
<polyline points="917.76,220 917.76,250.6" fill="none" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="24" y1="270" x2="936" y2="270" stroke="#E4E7EB" stroke-width="1.25" stroke-linecap="butt"/>
<text x="24" y="302" font-size="19" fill="#1F2933" font-weight="600">(b) Lead time pushes buffers up, more when errors don’t cancel</text>
<text x="24" y="328" font-size="15" fill="#1F2933" font-weight="600">independent</text>
