<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Approved as four, needs 4.8</title><desc id="d">Machine diagrams. The need is 200 cores and 1.6 TB of memory. Four standard machines (4 NMU) give 200 cores but only 0.8 TB. Eight standard (8 NMU) give enough memory with half the cores stranded. Two standard plus two high-memory (4.8 NMU) fit exactly. The 0.8 NMU gap goes on the fulfillment ledger with a named owner. Via standard machines each extra GB costs 0.005 NMU, five times its weight; high-memory machines take two quarters, standard ones come from the stocked pool in weeks. Illustrative.</desc><defs><pattern id="k-hatch-stranded" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#E4E7EB"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8A96A3" stroke-width="1.2"/></pattern><pattern id="k-hatch-light" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD2D9" stroke-width="1.2"/></pattern><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern><pattern id="k-dots-gray" patternUnits="userSpaceOnUse" width="5" height="5"><rect width="5" height="5" fill="#F5F7FA"/><circle cx="2.5" cy="2.5" r="1.25" fill="#616E7C"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
