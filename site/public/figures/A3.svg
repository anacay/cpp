<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Where approved demand leaks</title><desc id="d">Schematic seven-step funnel: Declared, Approved, Allocated, Delivered, Live, Adopted, Productive. Lettered gaps (a)–(f) name each leak and its owner, from forecast error (declaring team) to occupancy without goodput (workload owner). Notes mark firmness classes at approval, the limits of markets over steps 2–3, and supply contracts creating liabilities over steps 3–4. Netting sits between approved and allocated. Delivered is itself a chain from order to turn-up, where each link's need date is the next link's start. Approvals stay uncommitted until supply answers.</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
