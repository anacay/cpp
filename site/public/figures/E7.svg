<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">A cancel window is a staircase</title><desc id="d">Step chart of the share of an order's price owed on cancelling, by time before delivery: a tenth a year out, half a quarter out, all of it inside the vendor's build time. A dashed line at 100% marks orders that are non-cancellable from the start. A two-way arrow says a delivery can usually be pushed out or pulled in for less than cancelling. A marker at the edge of the cheap step defines the cancel window as the last date you can still walk away cheaply. A side card says that once the window closes the forecast is a liability, recorded with its cancel window and owner in mechanism 11. Hypothetical.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
