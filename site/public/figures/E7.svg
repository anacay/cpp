<line x1="475.6" y1="394" x2="475.6" y2="402" stroke="#1F2933" stroke-width="1.25" stroke-linecap="butt"/>
<text x="398.88" y="418" font-size="15" fill="#3E4C59" text-anchor="middle">a quarter out</text>
