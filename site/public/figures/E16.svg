<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Who decides what: nine decision rights</title><desc id="d">Matrix of nine decision rights against seven roles. A named executive, a column of its own, holds only the cut-line override, logged with the displaced claim. The forum re-cuts the plan in ranked order, with finance, when the envelope changes. Planning promotes, demotes or expires declarations, on the stage's evidence or a missed target date, and names interim owners for orphaned coefficients. The new accountable leader re-signs after a reorganization. Finance and product, the declaring team, set the shortage-to-idle ratios jointly, with supply's input on the cost of idle and the liability terms. Supply and planning set change bands inside each lead time, the declaring team signs them, and finance agrees who pays for a change outside them. Supply answers each ask with a commit or a gap and accepts a substitute shape or site. Reliability engineering sets reliability buffers. A footer adds the efficiency landing rule, who keeps capacity a team saves, agreed before any recovery by planning with finance (mechanism 8).</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
