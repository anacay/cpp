<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">The Meet case on two clocks</title><desc id="d">Two lanes from Figure 22, redrawn for the Meet case. Demand lane: the first signal is pages for regional capacity [7], and the stages arrive almost at once near the right edge; in the author's reading, declarations arrive too late for the slow layers. Demand grew 30x in three months [110]. Supply lane: the commit points of land, power and shell, and network sit far to the left, greyed as already past, also the author's reading. Machines are not greyed: they came through regular orders and borrowing [7]. Near the right edge, four fast levers: borrow, a bridge; re-shape; efficiency work; and escape hatches built ahead of need, inside a daily loop asking whether there is enough for the load one week out [7]. Schematic; a reading of a public case.</desc><defs><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
