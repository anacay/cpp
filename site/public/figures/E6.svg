<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">A declaration's life, and how it is scored</title><desc id="d">State diagram. A launch with no history enters as a declaration and moves Intent, Dated, Configured, Live, Organic. Each promotion needs evidence: a named owner and driver; funding with a target date; a design review and a place on the launch calendar; the launch; a completed ramp. Organic closes the declaration. An intent not advanced by its target date leaves the envelope unless re-confirmed. A configured launch's grant lapses if its date passes unconfirmed, and the slip becomes a recorded event. Planning promotes, demotes or expires a declaration, on the stage's evidence or a missed target date. Within a stage, a change inside its change band is the plan working; outside it, a priced event recorded against the declaration. Declared size and date are scored against actuals by the stage the ask was made (mechanism 2) and feed the all-teams stage record, a reference class [10]. An inset blends eight launches of that record at 60% with Team T's two at 50%, giving 58%, where T's next intent enters. A note says a team whose intents land at half and whose configured asks land within 10% is calibrated late, not dishonest. Tags tie two games to their counters: stage inflation to promotion only on evidence, and parked intents to expiry. Illustrative.</desc><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
