<text x="516" y="67" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="516" dy="0">Each arrow names the evidence a promotion needs.</tspan><tspan x="516" dy="19.5">Games and counters (Section 10.3): stage inflation →</tspan><tspan x="516" dy="19.5">promotion only on the stage's evidence; parked intents</tspan><tspan x="516" dy="19.5">→ expire if they don't advance.</tspan></text>
