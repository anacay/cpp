<text x="80" y="448.75" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="80" dy="0">Planning promotes, demotes or expires a</tspan><tspan x="80" dy="19.5">declaration, on the stage's evidence or a</tspan><tspan x="80" dy="19.5">missed target date (Section 9.2).</tspan></text>
