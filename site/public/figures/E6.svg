<text x="224" y="575.25" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1"><tspan x="224" dy="0">Blend (illustrative): all teams' intents land</tspan><tspan x="224" dy="19.5">at 60%, weighted as 8 launches; Team</tspan><tspan x="224" dy="19.5">T's two at 50%. (8 × 0.60 + 2 × 0.50) ÷</tspan><tspan x="224" dy="19.5">10 = 0.58: T's next intent enters at 58%</tspan><tspan x="224" dy="19.5">of declared size.</tspan></text>
