<path d="M902,280 H894 V364 H902 M894,322 H889" fill="none" stroke="#616E7C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="884" y="317" font-size="15" fill="#1F2933" text-anchor="end" font-weight="600"><tspan x="884" dy="0">persistent step →</tspan><tspan x="884" dy="19.5">owned capacity</tspan></text>
<path d="M680,106 H688 V274 H680 M688,190 H693" fill="none" stroke="#0B63C4" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="702" y="130" font-size="15" fill="#0B63C4" font-weight="600"><tspan x="702" dy="0">transient spike →</tspan><tspan x="702" dy="19.5">returnable:</tspan></text>
<text x="702" y="174" font-size="15" fill="#3E4C59"><tspan x="702" dy="0">shifted work, reclaimed and</tspan><tspan x="702" dy="19.5">borrowed buffers, third-party</tspan><tspan x="702" dy="19.5">capacity; admission control at</tspan><tspan x="702" dy="19.5">the very top</tspan></text>
