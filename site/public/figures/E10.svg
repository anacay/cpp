<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Size, timing and persistence</title><desc id="d">Four panels. (a) A size miss is paid mostly on the slow and middle layers: too high, and capacity waits for demand; too low, and the gap needs bridges. (b) A slip is paid mostly at the machine and turn-up layers, for the length of the slip. A building serving twenty launches hardly notices one six weeks late. (c) A launch as a persistent step with a transient spike on top. The step wants owned capacity; the spike wants returnable capacity (shifted work, reclaimed and borrowed buffers, third-party capacity, admission control at the top). Sizing owned capacity on the spike buys permanent capacity for a temporary peak. (d) On the bill: a size miss shows as a smaller bill, in the volume term; a slip is invisible on a flat realized-peak bill, and under hour-by-hour billing its cost moves to the service's unused line. Schematic.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="44" font-size="19" fill="#1F2933" font-weight="600">(a) Size miss</text>
<text x="24" y="68" font-size="15" fill="#3E4C59">shaded: where it is paid</text>
<rect x="24" y="82" width="222" height="34" rx="3" fill="#CBD2D9" stroke="#616E7C" stroke-width="1" data-cat="paid" data-cue="label"/>
<g transform="translate(33,88) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<path d="M1.5,21 H22.5 M3.5,21 V7 H20.5 V21"/>
<path d="M13.5,9 L8.5,15 H12 L10.5,19.5 L15.5,13 H12 Z" fill="#1F2933" stroke-width="1"/>
</g>
