<text x="24" y="268" font-size="15" fill="#3E4C59"><tspan x="24" dy="0">paid on what was bought for</tspan><tspan x="24" dy="19.5">the size, mostly the slow and</tspan><tspan x="24" dy="19.5">middle layers; too high waits</tspan><tspan x="24" dy="19.5">for demand, too low needs</tspan><tspan x="24" dy="19.5">bridges</tspan></text>
