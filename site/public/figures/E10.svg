<text x="311" y="224.25" font-size="15" fill="#1F2933">Turn-up</text>
<text x="272" y="268" font-size="15" fill="#3E4C59"><tspan x="272" dy="0">paid for the length of the slip,</tspan><tspan x="272" dy="19.5">mostly on machines and</tspan><tspan x="272" dy="19.5">turn-up: a building serving</tspan><tspan x="272" dy="19.5">twenty launches hardly</tspan><tspan x="272" dy="19.5">registers one six weeks late;</tspan><tspan x="272" dy="19.5">the machines turned up for it</tspan><tspan x="272" dy="19.5">do</tspan></text>
