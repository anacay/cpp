<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Power reported by firmness</title><desc id="d">Two bar panels in gigawatts, each with its own scale. Dominion Energy, as of July 2025, reports data-center contract capacity of 9.8 GW under electric service agreements, 7.1 GW under construction letters of authorization, and 30.1 GW under engineering letters of authorization, labeled potential future load [92]. CoreWeave reports about 3.1 GW of contracted power at the end of 2025, against more than 850 MW active [68]. Filling squares mark firmness in each source's own order. The panels are not comparable and the tiers are not added.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
