<text x="818" y="215.25" font-size="15" fill="#1F2933" text-anchor="middle" style="font-feature-settings:'tnum' 1">cover, net, split (steps 4–6)</text>
<rect x="56" y="332" width="272" height="146" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="192" y="410.25" font-size="15" fill="#1F2933" text-anchor="middle"></text>
<text x="98" y="390.75" font-size="15" fill="#1F2933"><tspan x="98" dy="0">Ask for the decision earlier:</tspan><tspan x="98" dy="19.5">the intake asks slow</tspan><tspan x="98" dy="19.5">attributes first</tspan></text>
<text x="76" y="410.95" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">1</text>
