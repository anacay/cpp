<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">When the commit point comes first: three choices</title><desc id="d">Decision tree for one supply layer, in the same order as the method's flowchart. The first question asks whether any declaration exists at the layer's commit point. If none does, the portfolio envelope serves the layer and the launch's claim on it is recorded, as for land, power and shell. If one does, a second question asks whether the attribute that drives the layer (region, redundancy tier, hardware class and power density, or data stored) is known by its commit point. If yes, the planner goes on to cover, net and split. If no, there are three unranked choices: ask for the decision earlier; buy an option that carries the commitment past the event; or commit to the stage's record and name the owner of the residual. Each choice ends in a decision note recording what was known, when, by whom, and what would have changed it. A worked row from Appendix A: high-memory machines commit at −11 while the launch is an intent. Stored data is asked at −12 as a range of 8 to 20 TB, and one machine is ordered reschedulable until −3. Illustrative.</desc><defs><pattern id="k-hatch-stranded" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#E4E7EB"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8A96A3" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<path d="M480,24 L630,76 L480,128 L330,76 Z" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/>
<text x="480" y="61.75" font-size="15" fill="#1F2933" text-anchor="middle"><tspan x="480" dy="0">Does any</tspan><tspan x="480" dy="19.5">declaration exist at this</tspan><tspan x="480" dy="19.5">commit point?</tspan></text>
<rect x="24" y="35" width="270" height="82" rx="4" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1"/>
<rect x="24" y="35" width="3" height="82" fill="#8A96A3" stroke="none"/>
