<text x="480" y="410.25" font-size="15" fill="#1F2933" text-anchor="middle"></text>
<text x="386" y="361.5" font-size="15" fill="#1F2933"><tspan x="386" dy="0">Buy an option</tspan><tspan x="386" dy="19.5">past the event: a</tspan><tspan x="386" dy="19.5">small payment</tspan><tspan x="386" dy="19.5">now for the right,</tspan><tspan x="386" dy="19.5">not the duty, to</tspan><tspan x="386" dy="19.5">buy later</tspan></text>
<text x="364" y="410.95" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1">2</text>
