<rect x="700" y="35" width="236" height="82" rx="6" fill="#F5F7FA" stroke="#8A96A3" stroke-width="1.25"/>
<text x="818" y="61.75" font-size="15" fill="#1F2933" text-anchor="middle"><tspan x="818" dy="0">Portfolio envelope serves it;</tspan><tspan x="818" dy="19.5">record the launch's claim on</tspan><tspan x="818" dy="19.5">it (as for land, power, shell)</tspan></text>
