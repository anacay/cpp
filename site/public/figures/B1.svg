<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Declarations firm up in stages</title><desc id="d">Five-stage staircase: Intent, Dated, Configured, Live, Organic. Each step shows what is known, the evidence needed to enter it and the supply action it licenses, from a share of the envelope and options at Intent to closing the declaration at Organic. The range of likely size narrows at each decision event.</desc><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
<text x="24" y="44" font-size="15" fill="#3E4C59">Uncertainty drops at decision events, not smoothly.</text>
<text x="24" y="64" font-size="15" fill="#3E4C59">Bar = range of likely size</text>
<rect x="24" y="232" width="182.4" height="30" fill="#F5F7FA" stroke="none"/>
<line x1="24" y1="232" x2="206.4" y2="232" stroke="#1F2933" stroke-width="2.5" stroke-linecap="butt"/>
<g transform="translate(31,203) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="9" stroke-dasharray="3 2.6"/>
</g>
<text x="60" y="220" font-size="17" fill="#1F2933" font-weight="600">Intent</text>
