<text x="28" y="307.5" font-size="15" fill="#3E4C59"><tspan x="28" dy="0">coming; a size range; a</tspan><tspan x="28" dy="19.5">half-year or year</tspan></text>
<text x="28" y="354.5" font-size="15" fill="#1F2933" font-weight="600">To enter:</text>
<text x="93.76" y="354.5" font-size="15" fill="#3E4C59"> a named</text>
<text x="28" y="374" font-size="15" fill="#3E4C59">owner and driver</text>
<text x="28" y="401.5" font-size="15" fill="#1F2933" font-weight="600">Licenses:</text>
<text x="97.31" y="401.5" font-size="15" fill="#3E4C59"> a share of</text>
<text x="28" y="421" font-size="15" fill="#3E4C59"><tspan x="28" dy="0">the envelope; options</tspan><tspan x="28" dy="19.5">or cancelable</tspan><tspan x="28" dy="19.5">commitments on the</tspan><tspan x="28" dy="19.5">slowest layers</tspan></text>
