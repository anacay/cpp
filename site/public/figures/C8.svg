<path d="M5,18 V13.5 M8,18 V15 M11,18 V13.5 M14,18 V15"/>
</g>
<text x="692" y="184" font-size="17" fill="#1F2933" font-weight="600">named</text>
<text x="644" y="207" font-size="15" fill="#3E4C59"><tspan x="644" dy="0">above 70k up to 90k: a bridge with an</tspan><tspan x="644" dy="19.5">owner and a ready-by date; admission</tspan><tspan x="644" dy="19.5">control at the very top</tspan></text>
<line x1="24" y1="265.6" x2="936" y2="265.6" stroke="#CBD2D9" stroke-width="1.25" stroke-linecap="butt"/>
<text x="24" y="287.6" font-size="15" fill="#1F2933" font-weight="600" style="font-feature-settings:'tnum' 1">Worked row (Appendix A, step 6): standard machines</text>
<text x="24" y="308.6" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1">2 from the pool at −3 (the base)</text>
<text x="334" y="308.6" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1"><tspan x="334" dy="0">1 from the pool as a named launch</tspan><tspan x="334" dy="19.5">reserve, pegged to A (base 60 → 70)</tspan></text>
<text x="644" y="308.6" font-size="15" fill="#1F2933"><tspan x="644" dy="0">a bridge ready by launch, owned by X: 2</tspan><tspan x="644" dy="19.5">more standard run for their memory, or</tspan><tspan x="644" dy="19.5">1 older high-memory kept past</tspan><tspan x="644" dy="19.5">decommission</tspan></text>
<line x1="24" y1="380.7" x2="936" y2="380.7" stroke="#CBD2D9" stroke-width="1.25" stroke-linecap="butt"/>
<text x="24" y="402.7" font-size="15" fill="#1F2933" font-weight="600">Worked row (Appendix A, step 6): high-memory machines (sized at intent, step 4)</text>
<text x="24" y="423.7" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1">1 ordered at −11, plus the reclaim</text>
<text x="334" y="423.7" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1">1 ordered at −11, reschedulable until −3</text>
<text x="644" y="423.7" font-size="15" fill="#1F2933">—</text>
<line x1="24" y1="437.3" x2="936" y2="437.3" stroke="#CBD2D9" stroke-width="1.25" stroke-linecap="butt"/>
<rect x="24" y="447.3" width="560" height="38.25" rx="4" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1"/>
<rect x="24" y="447.3" width="3" height="38.25" fill="#8A96A3" stroke="none"/>
<text x="40" y="471.3" font-size="15" fill="#3E4C59">Prefer the right to push a delivery out over the right to cancel.</text>
<text x="936" y="508" font-size="15" fill="#3E4C59" text-anchor="end">Illustrative (Appendix A)</text>
