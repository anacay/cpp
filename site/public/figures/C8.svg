<text x="470.6" y="107" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="600" style="font-feature-settings:'tnum' 1" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">55</text>
