<text x="58" y="106.25" font-size="15" fill="#1F2933">Configured</text>
<text x="220" y="142" font-size="15" fill="#3E4C59">ten equally likely outcomes at the configured stage, thousand requests per second</text>
<rect x="24" y="170" width="28" height="16" fill="#3E4C59" stroke="#1F2933" stroke-width="1" data-cat="firm" data-cue="label"/>
<text x="60" y="184" font-size="17" fill="#1F2933" font-weight="600">firm</text>
<text x="24" y="207" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">up to the base (60k): plain order</text>
<rect x="334" y="170" width="28" height="16" fill="url(#k-hatch-blue)" stroke="#0B63C4" stroke-width="1.5" data-cat="flexible" data-cue="pattern"/>
<text x="370" y="184" font-size="17" fill="#1F2933" font-weight="600">flexible</text>
<text x="334" y="207" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="334" dy="0">base → step 4 target (70k): options,</tspan><tspan x="334" dy="19.5">cancelable or reschedulable orders, a</tspan><tspan x="334" dy="19.5">named launch reserve</tspan></text>
<rect x="650" y="170" width="34" height="16" fill="#FFFFFF" stroke="#1F2933" stroke-width="1.75" stroke-dasharray="1.5 3" data-cat="named" data-cue="shape"/>
