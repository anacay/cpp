<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Firm, flexible, named</title><desc id="d">Ten configured-stage outcomes from 40,000 to 90,000 requests per second. Up to the 60,000 base is firm, ordered plainly. From 60,000 to the 70,000 target is flexible: options, reschedulable orders or a named reserve. Above 70,000 to 90,000 is named: a bridge with an owner and a ready-by date, then admission control. Worked rows for standard and high-memory machines follow. Illustrative.</desc><defs><pattern id="k-hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCEBFA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0B63C4" stroke-width="1.6"/></pattern><pattern id="k-hatch-light" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD2D9" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
