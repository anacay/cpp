<text x="140" y="126" font-size="15" fill="#3E4C59" text-anchor="end" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">copies stocked</text>
<polyline points="176,142 176,120.75 145,120.75" fill="none" stroke="#8A96A3" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="91" y="254" font-size="15" fill="#3E4C59" text-anchor="middle">unsold copy</text>
<text x="448" y="254" font-size="15" fill="#3E4C59" text-anchor="middle">buyer turned away</text>
<text x="270" y="282" font-size="15" fill="#3E4C59" text-anchor="middle">stock before knowing how many will sell</text>
<text x="560" y="78" font-size="15" fill="#3E4C59"><tspan x="560" dy="0">For example, if being short costs four times what a</tspan><tspan x="560" dy="19.5">spare unit costs:</tspan></text>
<text x="560" y="134" font-size="17" fill="#1F2933" font-weight="600">shortage-to-idle ratio 4 : 1</text>
<text x="560" y="166" font-size="19" fill="#0B63C4" font-weight="600" style="font-feature-settings:'tnum' 1">→ 4 / (4 + 1) = 0.8</text>
<text x="560" y="214" font-size="19" fill="#1F2933">C<tspan font-size="15" dy="4">u</tspan><tspan dy="-4"> / (C</tspan><tspan font-size="15" dy="4">u</tspan><tspan dy="-4"> + C</tspan><tspan font-size="15" dy="4">o</tspan><tspan dy="-4">)</tspan></text>
<text x="560" y="242" font-size="15" fill="#3E4C59">cost of being short ÷ (cost of short + cost of spare)</text>
<text x="560" y="274" font-size="15" fill="#3E4C59"><tspan x="560" dy="0">Textbooks call the whole problem the newsvendor</tspan><tspan x="560" dy="19.5">problem [78]; this paper, the shortage-to-idle ratio.</tspan></text>
