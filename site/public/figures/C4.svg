<text x="60" y="336" font-size="15" fill="#3E4C59">ten equally likely outcomes, lowest → highest</text>
<text x="816" y="374" font-size="15" fill="#3E4C59" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">accept short</text>
