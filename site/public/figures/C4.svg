<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" width="100%" role="img" aria-labelledby="t d" data-canvas="standard" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The newspaper seller: how far up the range to buy</title><desc id="d">A newspaper seller stocks copies before knowing demand. Below, ten equally likely demand outcomes from lowest to highest; with running short costing four times holding a spare, the fraction is 0.8, so the plan covers the eighth-lowest and accepts running short in the two above. A note credits the textbook newsvendor formula [78], which this paper calls the shortage-to-idle ratio.</desc><defs><pattern id="k-hatch-light" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="7" stroke="#CBD2D9" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="536" fill="#FFFFFF"/>
