<text x="395" y="424" font-size="15" fill="#3E4C59" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke" stroke-linejoin="round">covered: up to the eighth-lowest (0.8)</text>
<line x1="24" y1="436" x2="936" y2="436" stroke="#CBD2D9" stroke-width="1.25" stroke-linecap="butt"/>
<text x="24" y="461" font-size="15" fill="#3E4C59">In the scene → in capacity terms:</text>
<text x="273.15" y="461" font-size="15" fill="#3E4C59">papers</text>
<text x="322.25" y="461" font-size="15" fill="#3E4C59"> → </text>
<text x="344.99" y="461" font-size="15" fill="#1F2933" font-weight="600">capacity bought</text>
<text x="476.41" y="461" font-size="15" fill="#3E4C59" text-anchor="middle">·</text>
<text x="490.41" y="461" font-size="15" fill="#3E4C59">unsold copy</text>
<text x="577.26" y="461" font-size="15" fill="#3E4C59"> → </text>
<text x="600" y="461" font-size="15" fill="#1F2933" font-weight="600">idle capacity</text>
<text x="24" y="485" font-size="15" fill="#3E4C59">turned-away buyer</text>
<text x="159.73" y="485" font-size="15" fill="#3E4C59"> → </text>
<text x="182.47" y="485" font-size="15" fill="#1F2933" font-weight="600">shortage</text>
<text x="936" y="508" font-size="15" fill="#3E4C59" text-anchor="end">Illustrative numbers</text>
