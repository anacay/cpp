<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" width="100%" role="img" aria-labelledby="t d" data-canvas="tall" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">AI fleets: the same structure, new units</title><desc id="d">Two panels. (a) Four translations. For the largest operators' AI fleets, by their own account [72, 90], the binding resource moves from dollars toward critical IT megawatts; say which power, and at a PUE of 1.2, 10 MW of IT load is 12 MW of facility power. Shape becomes one interconnect domain, where quota can exist without geometry, in about 1% of cases [18]. The driver becomes tokens with two phases: 1,900 tokens in and 100 out is mostly prefill compute, while 100 in and 1,900 out is 1,900 decode steps holding cache memory. Productivity moves from utilization to goodput. (b) A schematic timeline: a training run is declared and still an intent while its power and cooling are committed years ahead, against a hardware generation that may not ship on time. A model launch is a transient spike on a persistent step, declared as two shapes. Illustrative.</desc><defs><pattern id="k-hatch-stranded" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)"><rect width="5" height="5" fill="#E4E7EB"/><line x1="0" y1="0" x2="0" y2="5" stroke="#8A96A3" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="960" height="790" fill="#FFFFFF"/>
<text x="24" y="44" font-size="19" fill="#1F2933" font-weight="600">(a) What changes: classic → AI fleet</text>
<g transform="translate(28,63.75) scale(0.92)" fill="none" stroke="#1F2933" stroke-width="1.91" stroke-linecap="round" stroke-linejoin="round">
<path d="M1.5,21 H22.5 M3.5,21 V7 H20.5 V21"/>
<path d="M13.5,9 L8.5,15 H12 L10.5,19.5 L15.5,13 H12 Z" fill="#1F2933" stroke-width="1"/>
</g>
<text x="66" y="80" font-size="15" fill="#1F2933" font-weight="600">binding resource: dollars</text>
<text x="364" y="80" font-size="15" fill="#3E4C59">→</text>
<text x="394" y="80" font-size="15" fill="#1F2933">toward critical IT megawatts</text>
<text x="394" y="99.5" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="394" dy="0">for the largest operators' AI fleets, by their own account [72, 90]; say which</tspan><tspan x="394" dy="19.5">power: contracted, provisioned or drawn; 10 MW critical IT at PUE 1.2 = 12</tspan><tspan x="394" dy="19.5">MW facility (illustrative)</tspan></text>
<line x1="24" y1="162" x2="936" y2="162" stroke="#E4E7EB" stroke-width="1" stroke-linecap="butt"/>
<rect x="27" y="168.65" width="24" height="7.2" rx="0.9" fill="#3E4C59" stroke="#1F2933" stroke-width="1.25" data-cat="cores-used" data-cue="shape"/>
<rect x="27" y="177.65" width="7.2" height="7.2" rx="0.6" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<rect x="35.4" y="177.65" width="7.2" height="7.2" rx="0.6" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<rect x="43.8" y="177.65" width="7.2" height="7.2" rx="0.6" fill="#E4E7EB" stroke="#1F2933" stroke-width="1.25"/>
<text x="66" y="182" font-size="15" fill="#1F2933" font-weight="600">shape: CPU to memory</text>
<text x="364" y="182" font-size="15" fill="#3E4C59">→</text>
<text x="394" y="182" font-size="15" fill="#1F2933">one interconnect domain</text>
<text x="394" y="201.5" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1">quota exists but geometry does not: about 1% of cases [18]</text>
<line x1="24" y1="225" x2="936" y2="225" stroke="#E4E7EB" stroke-width="1" stroke-linecap="butt"/>
<text x="66" y="245" font-size="15" fill="#1F2933" font-weight="600">driver: requests</text>
<text x="364" y="245" font-size="15" fill="#3E4C59">→</text>
<text x="394" y="245" font-size="15" fill="#1F2933">tokens, two phases</text>
<text x="394" y="264.5" font-size="15" fill="#3E4C59" style="font-feature-settings:'tnum' 1"><tspan x="394" dy="0">1,900 in / 100 out: mostly prefill compute · 100 in / 1,900 out: 1,900</tspan><tspan x="394" dy="19.5">decode steps, each holding cache memory (illustrative)</tspan></text>
<line x1="24" y1="307.5" x2="936" y2="307.5" stroke="#E4E7EB" stroke-width="1" stroke-linecap="butt"/>
<text x="66" y="327.5" font-size="15" fill="#1F2933" font-weight="600">productivity: utilization</text>
<text x="364" y="327.5" font-size="15" fill="#3E4C59">→</text>
<text x="394" y="327.5" font-size="15" fill="#1F2933" style="font-feature-settings:'tnum' 1">goodput: real progress, not busy chips (§11)</text>
<rect x="20" y="58" width="920" height="98" rx="4" fill="none" stroke="#0B63C4" stroke-width="2"/>
<line x1="24" y1="361" x2="936" y2="361" stroke="#E4E7EB" stroke-width="1.25" stroke-linecap="butt"/>
<text x="24" y="395" font-size="19" fill="#1F2933" font-weight="600">(b) A training cluster is a step on both sides</text>
<text x="24" y="417" font-size="15" fill="#3E4C59">schematic: time runs toward launch, no month scale</text>
