<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">Where a retiring host and its drives can go</title><desc id="d">A host reaching retirement has three branches: keep it as it is, redeploy it intact to a lower-demand workload class, or disassemble it and harvest its drives. Harvested drives are sanitized and tested, then go to one of five outcomes: workloads, the spares pool, upgrades and builds, resale or recycling, or destruction on site.</desc><rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3E4C59"/></marker><marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7B8794"/></marker></defs>
<rect x="400" y="30" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="500.0" y="64.0" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600">Host retires</text>
<rect x="40" y="150" width="220" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="150.0" y="191.0" font-size="17" fill="#1F2933" text-anchor="middle">Keep as it is</text>
<rect x="330" y="150" width="300" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="480.0" y="180.5" font-size="17" fill="#1F2933" text-anchor="middle">Redeploy intact</text>
<text x="480.0" y="201.5" font-size="14" fill="#3E4C59" text-anchor="middle">to a lower-demand workload class</text>
<rect x="700" y="150" width="260" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="830.0" y="180.5" font-size="17" fill="#1F2933" text-anchor="middle">Disassemble</text>
<text x="830.0" y="201.5" font-size="14" fill="#3E4C59" text-anchor="middle">and harvest the drives</text>
<path d="M450,86 C450,118 150,118 150,146" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<path d="M500,86 L480,146" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<path d="M550,86 C550,118 830,118 830,146" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="705" y="290" width="250" height="62" rx="6" fill="#FFFFFF" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="830.0" y="327.0" font-size="17" fill="#1F2933" text-anchor="middle" font-weight="600">Sanitize and test</text>
<path d="M830,220 L830,286" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="35.0" y="430" width="170" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="120.0" y="471.0" font-size="17" fill="#1F2933" text-anchor="middle">Workloads</text>
<path d="M830,352 C830,392 120.0,392 120.0,426" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="225.0" y="430" width="170" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="310.0" y="471.0" font-size="17" fill="#1F2933" text-anchor="middle">Spares pool</text>
<path d="M830,352 C830,392 310.0,392 310.0,426" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="415.0" y="430" width="170" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="500.0" y="460.5" font-size="17" fill="#1F2933" text-anchor="middle">Upgrades</text>
<text x="500.0" y="481.5" font-size="14" fill="#3E4C59" text-anchor="middle">and builds</text>
<path d="M830,352 C830,392 500.0,392 500.0,426" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="605.0" y="430" width="170" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="690.0" y="460.5" font-size="17" fill="#1F2933" text-anchor="middle">Resale</text>
<text x="690.0" y="481.5" font-size="14" fill="#3E4C59" text-anchor="middle">or recycling</text>
<path d="M830,352 C830,392 690.0,392 690.0,426" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="795.0" y="430" width="170" height="70" rx="6" fill="#F5F7FA" stroke="#CBD2D9" stroke-width="1.5"/>
<text x="880.0" y="460.5" font-size="17" fill="#1F2933" text-anchor="middle">Destroyed</text>
<text x="880.0" y="481.5" font-size="14" fill="#3E4C59" text-anchor="middle">on site</text>
<path d="M830,352 C830,392 880.0,392 880.0,426" fill="none" stroke="#3E4C59" stroke-width="1.75" marker-end="url(#a)"/>
<text x="40" y="540" font-size="14" fill="#3E4C59">Host branches decide whether drives are harvested at all; harvested drives then pass sanitization and test before any outcome.</text>
</svg>
