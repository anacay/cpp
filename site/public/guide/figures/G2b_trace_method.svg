<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 925" width="100%" role="img" aria-labelledby="t d" data-canvas="pullout" preserveAspectRatio="xMidYMid meet" style="max-width:100%;height:auto;display:block" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><title id="t">The same launch with the commit-point method</title><desc id="d">The same grid, with the seed paper's worked example traced with the commit-point method. 1: Intent at about −12, stored data asked as a range and change bands of plus or minus 50% agreed, launch row, annual. 2: high-memory machines commit at −11, at Intent, region row, annual; power committed earlier, at −20. 3: Dated at −6, base 60,000 and high 90,000, inside the band agreed at intent, quarterly. 4: Configured at −3, sized to 70,000, the 80th percentile, monthly. 5: machines on the dock by −2 and ready at −1, region row, monthly. 6: no bridge needed at the base; above 70,000 a bridge named in advance, portfolio row, weekly. 7: the launch lands at 40,000, recorded as a band breach on the declaration, post-launch. 8: about 1.0 NMU of spare, priced and owned, and the next coefficient, unit row, post-launch. Illustrative numbers.</desc><rect x="0" y="0" width="1280" height="925" fill="#FFFFFF"/>
<text x="226" y="58" font-size="17" fill="#1F2933" font-weight="600">Annual</text>
<text x="226" y="82" font-size="15" fill="#3E4C59">years out</text>
<text x="434" y="58" font-size="17" fill="#1F2933" font-weight="600">Quarterly</text>
<text x="434" y="82" font-size="15" fill="#3E4C59">quarters out</text>
<text x="642" y="58" font-size="17" fill="#1F2933" font-weight="600">Monthly</text>
<text x="642" y="82" font-size="15" fill="#3E4C59">weeks to months</text>
<text x="850" y="58" font-size="17" fill="#1F2933" font-weight="600">Weekly</text>
<text x="850" y="82" font-size="15" fill="#3E4C59">days to weeks</text>
<text x="1058" y="58" font-size="17" fill="#1F2933" font-weight="600">Post-launch</text>
<text x="1058" y="82" font-size="15" fill="#3E4C59">after it lands</text>
<text x="24" y="142" font-size="17" fill="#1F2933" font-weight="600">Envelope</text>
<text x="24" y="166" font-size="15" fill="#3E4C59">capital, fleet</text>
